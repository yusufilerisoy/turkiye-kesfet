  <script type="text/babel" data-presets="react">
const { useState: useStateQuiz, useEffect: useEffectQuiz, useMemo: useMemoQuiz, useRef: useRefQuiz } = React;

const QUIZ_QUESTION_SECONDS = 15;
const QUIZ_FEEDBACK_MS = 800;

const QuizScreen = ({ onComplete }) => {
  const progress = window.useProgress ? window.useProgress() : null;
  const questions = (window.getQuizForGame ? window.getQuizForGame() : null) || (window.FINAL_QUIZ || []);
  const total = questions.length;

  const [qIdx, setQIdx] = useStateQuiz(0);
  const [score, setScore] = useStateQuiz(0);
  const [wrong, setWrong] = useStateQuiz(0);
  const [feedback, setFeedback] = useStateQuiz(null);
  const [hiddenOptions, setHiddenOptions] = useStateQuiz([]);
  const [fiftyUsed, setFiftyUsed] = useStateQuiz(false);

  const startedAtRef = useRefQuiz(Date.now());
  const questionStartedAtRef = useRefQuiz(Date.now());
  const advanceTimerRef = useRefQuiz(null);
  const completedRef = useRefQuiz(false);

  useEffectQuiz(() => {
    questionStartedAtRef.current = Date.now();
    setHiddenOptions([]);
    setFeedback(null);
    return () => {
      if (advanceTimerRef.current) {
        clearTimeout(advanceTimerRef.current);
        advanceTimerRef.current = null;
      }
    };
  }, [qIdx]);

  const TimerBar = window.TimerBar;
  const Confetti = window.Confetti;

  const current = questions[qIdx];

  const finishQuiz = (finalScore) => {
    if (completedRef.current) return;
    completedRef.current = true;
    const totalTimeMs = Date.now() - startedAtRef.current;
    if (progress && typeof progress.setQuizScore === "function") {
      progress.setQuizScore(finalScore);
    }
    if (typeof onComplete === "function") onComplete(finalScore, totalTimeMs);
  };

  const goNext = (deltaScore = 0) => {
    setScore(prevScore => {
      const newScore = prevScore + deltaScore;
      if (qIdx + 1 >= total) {
        setTimeout(() => finishQuiz(newScore), 0);
      }
      return newScore;
    });
    if (qIdx + 1 < total) {
      setQIdx(idx => idx + 1);
    }
  };

  const handleAnswer = (optIdx) => {
    if (feedback !== null) return;
    const correct = optIdx === current.correct;
    const timeMs = Date.now() - questionStartedAtRef.current;

    if (progress && typeof progress.recordQuizAnswer === "function") {
      progress.recordQuizAnswer(qIdx, correct, timeMs);
    }

    setFeedback({ correct, picked: optIdx });
    if (!correct) setWrong(w => w + 1);

    advanceTimerRef.current = setTimeout(() => {
      goNext(correct ? 1 : 0);
    }, QUIZ_FEEDBACK_MS);
  };

  const handleTimerExpire = () => {
    if (feedback !== null) return;
    const timeMs = Date.now() - questionStartedAtRef.current;
    if (progress && typeof progress.recordQuizAnswer === "function") {
      progress.recordQuizAnswer(qIdx, false, timeMs);
    }
    setFeedback({ correct: false, picked: null });
    setWrong(w => w + 1);
    advanceTimerRef.current = setTimeout(() => {
      goNext(0);
    }, QUIZ_FEEDBACK_MS);
  };

  const handleSkip = () => {
    if (feedback !== null) return;
    const timeMs = Date.now() - questionStartedAtRef.current;
    if (progress && typeof progress.recordQuizAnswer === "function") {
      progress.recordQuizAnswer(qIdx, false, timeMs);
    }
    setWrong(w => w + 1);
    goNext(0);
  };

  const handleFifty = () => {
    if (fiftyUsed || feedback !== null || !current) return;
    const wrongs = current.options
      .map((_, i) => i)
      .filter(i => i !== current.correct);
    const shuffled = [...wrongs].sort(() => Math.random() - 0.5);
    const toHide = shuffled.slice(0, Math.min(2, shuffled.length));
    setHiddenOptions(toHide);
    setFiftyUsed(true);
  };

  if (!current) {
    return (
      <div className="paper-cream" style={{
        minHeight: "100vh", display: "grid", placeItems: "center",
        fontFamily: "var(--font-body)", color: "var(--ink)",
      }}>
        <div style={{ textAlign: "center", padding: 32 }}>
          <div className="t-label">Quiz</div>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 56, color: "var(--title)", marginTop: 6 }}>
            Soru yüklenemedi
          </div>
          <div style={{ fontFamily: "var(--font-hand)", fontSize: 20, color: "var(--ink-soft)", marginTop: 8 }}>
            FINAL_QUIZ verisi bulunamadı.
          </div>
        </div>
      </div>
    );
  }

  const feedbackBg = feedback === null
    ? "transparent"
    : feedback.correct
      ? "rgba(85,139,47,.18)"
      : "rgba(198,40,40,.18)";

  const optionColors = [
    "var(--r-karadeniz)",
    "var(--r-doguanadolu)",
    "var(--r-icanadolu)",
    "var(--r-akdeniz)",
    "var(--r-marmara)",
  ];

  return (
    <div className="paper-cream" style={{
      minHeight: "100vh", position: "relative", overflow: "hidden",
      fontFamily: "var(--font-body)", color: "var(--ink)",
      transition: "background 200ms ease",
    }}>
      <div style={{
        position: "absolute", inset: 0,
        background: feedbackBg,
        pointerEvents: "none",
        transition: "background 150ms ease",
        zIndex: 1,
      }}/>

      {feedback && feedback.correct && Confetti && (
        <div style={{ position: "absolute", inset: 0, zIndex: 1, pointerEvents: "none" }}>
          <Confetti count={20}/>
        </div>
      )}

      <div style={{ position: "relative", zIndex: 2, padding: "28px 40px 40px", maxWidth: 1200, margin: "0 auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 16 }}>
          <div>
            <div className="t-label" style={{ fontSize: 12 }}>Final Aşaması · Hızlı Bilgi Yarışması</div>
            <div style={{ fontFamily: "var(--font-display)", fontSize: 48, color: "var(--title)", lineHeight: 1 }}>
              Hızlı Bilgi Yarışması
            </div>
          </div>
          <div style={{ display: "flex", gap: 14, alignItems: "center", flexWrap: "wrap" }}>
            <div className="card" style={{ padding: "8px 14px" }}>
              <div className="t-label" style={{ fontSize: 10 }}>Soru</div>
              <div style={{ fontFamily: "var(--font-hand)", fontSize: 22, fontWeight: 700, color: "var(--title)" }}>
                {qIdx + 1} / {total}
              </div>
            </div>
            <div className="card" style={{ padding: "8px 14px", display: "flex", gap: 14 }}>
              <div>
                <div className="t-label" style={{ fontSize: 10 }}>Doğru</div>
                <div style={{ fontFamily: "var(--font-hand)", fontSize: 22, color: "var(--success)", fontWeight: 700 }}>
                  ✓ {score}
                </div>
              </div>
              <div style={{ width: 1, background: "var(--rule)" }}/>
              <div>
                <div className="t-label" style={{ fontSize: 10 }}>Yanlış</div>
                <div style={{ fontFamily: "var(--font-hand)", fontSize: 22, color: "var(--accent)", fontWeight: 700 }}>
                  ✕ {wrong}
                </div>
              </div>
            </div>
          </div>
        </div>

        <div style={{ marginTop: 20 }}>
          {TimerBar && (
            <TimerBar
              key={qIdx}
              seconds={QUIZ_QUESTION_SECONDS}
              paused={feedback !== null}
              onExpire={handleTimerExpire}
            />
          )}
        </div>

        <div className="card deckle" style={{
          marginTop: 32, padding: "44px 40px", textAlign: "center",
          background: "var(--bg-paper)",
        }}>
          <div className="t-label" style={{ fontSize: 11 }}>Coğrafya Sorusu</div>
          <div style={{
            fontFamily: "var(--font-display)", fontSize: 44, lineHeight: 1.1,
            color: "var(--title)", marginTop: 6,
            maxWidth: 880, marginLeft: "auto", marginRight: "auto",
          }}>
            {current.q}
          </div>

          <div style={{
            marginTop: 32,
            display: "grid",
            gridTemplateColumns: `repeat(${Math.min(current.options.length, 3)}, 1fr)`,
            gap: 14,
            maxWidth: 1000, marginLeft: "auto", marginRight: "auto",
          }}>
            {current.options.map((optText, i) => {
              const isHidden = hiddenOptions.indexOf(i) !== -1;
              const isPicked = feedback && feedback.picked === i;
              const isCorrectAnswer = feedback && i === current.correct;
              const showCorrectGlow = feedback !== null && isCorrectAnswer;
              const showWrongGlow = feedback && isPicked && !feedback.correct;

              const color = optionColors[i % optionColors.length];

              const borderColor = showCorrectGlow
                ? "var(--success)"
                : showWrongGlow
                  ? "var(--accent)"
                  : color;

              const bg = showCorrectGlow
                ? "rgba(85,139,47,.12)"
                : showWrongGlow
                  ? "rgba(198,40,40,.12)"
                  : "var(--bg-cream)";

              return (
                <button
                  key={i}
                  className="card"
                  onClick={() => handleAnswer(i)}
                  disabled={feedback !== null || isHidden}
                  aria-label={`Seçenek ${["A","B","C","D","E"][i]}: ${optText}`}
                  style={{
                    cursor: (feedback !== null || isHidden) ? "default" : "pointer",
                    padding: "20px 16px",
                    background: bg,
                    borderColor: borderColor,
                    borderWidth: 2,
                    textAlign: "center",
                    visibility: isHidden ? "hidden" : "visible",
                    opacity: isHidden ? 0 : 1,
                    transition: "all 200ms ease",
                    boxShadow: showCorrectGlow
                      ? "0 0 0 3px rgba(85,139,47,.25), var(--shadow-md)"
                      : showWrongGlow
                        ? "0 0 0 3px rgba(198,40,40,.25), var(--shadow-md)"
                        : "var(--shadow-sm)",
                  }}
                >
                  <div style={{
                    width: 40, height: 40, borderRadius: "50%", margin: "0 auto 8px",
                    background: showCorrectGlow ? "var(--success)" : (showWrongGlow ? "var(--accent)" : color),
                    color: "#FFF7EB",
                    display: "grid", placeItems: "center",
                    fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 700,
                  }}>
                    {showCorrectGlow ? "✓" : (showWrongGlow ? "✕" : ["A", "B", "C", "D", "E"][i])}
                  </div>
                  <div style={{
                    fontFamily: "var(--font-hand)", fontSize: 22,
                    color: "var(--ink)", fontWeight: 700,
                  }}>
                    {optText}
                  </div>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{ marginTop: 18, display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
          <button
            className="btn btn-tertiary"
            onClick={handleFifty}
            disabled={fiftyUsed || feedback !== null}
            aria-label="50:50 ipucu"
            style={{ opacity: (fiftyUsed || feedback !== null) ? 0.5 : 1, cursor: (fiftyUsed || feedback !== null) ? "not-allowed" : "pointer" }}
          >
            💡 50:50 ipucu ({fiftyUsed ? "0" : "1"} hak kaldı)
          </button>
          <button
            className="btn btn-secondary"
            onClick={handleSkip}
            disabled={feedback !== null}
            aria-label="Soruyu Atla"
            style={{ opacity: feedback !== null ? 0.5 : 1, cursor: feedback !== null ? "not-allowed" : "pointer" }}
          >
            Soruyu Atla →
          </button>
        </div>
      </div>
    </div>
  );
};

Object.assign(window, { QuizScreen });
  </script>

  <script type="text/babel" data-presets="react">
const { useState: useStateMission, useEffect: useEffectMission, useRef: useRefMission, useMemo: useMemoMission } = React;

(function injectMissionStyles() {

const arraysEqualAsSets = (a, b) => {
  if (!Array.isArray(a) || !Array.isArray(b)) return false;
  if (a.length !== b.length) return false;
  const sa = new Set(a);
  for (const x of b) if (!sa.has(x)) return false;
  return true;
};

/* SingleChoiceMission — selection: number (index) | null */
const SingleChoiceMission = ({ mission, selection, setSelection, locked }) => {
  const options = mission.options || [];
  const letters = ['A', 'B', 'C', 'D', 'E', 'F'];

};

/* MultiSelectMission — selection: number[] */
const MultiSelectMission = ({ mission, selection, setSelection, locked }) => {
  const options = mission.options || [];
  const sel = Array.isArray(selection) ? selection : [];
  const toggle = (i) => {
    if (locked) return;
    const idx = sel.indexOf(i);
    if (idx >= 0) {
      setSelection(sel.filter(x => x !== i));
    } else {
      setSelection([...sel, i]);

  };
  return (

        {options.map((opt, i) => {
          const isSel = sel.indexOf(i) !== -1;
          return (
            <button
              key={i}
              type="button"
              className="card"
              disabled={locked}
              onClick={() => toggle(i)}
              aria-pressed={isSel}
              style={{

                textAlign: 'left',
                cursor: locked ? 'default' : 'pointer',
                background: isSel ? '#E9F4DC' : 'var(--bg-cream)',

                borderStyle: 'solid',

                transition: 'all .15s ease',
              }}

              <div style={{

                border: '2px solid ' + (isSel ? 'var(--success)' : 'var(--ink-mute)'),
                background: isSel ? 'var(--success)' : 'transparent',
                color: '#FFF7EB',
                display: 'grid', placeItems: 'center', fontWeight: 700, fontSize: 16,
              }}>
                {isSel ? '✓' : ''}
              </div>
              <span style={{ flex: 1 }}>{opt}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
};

/* DragMatchMission — pairs: [{left, right}], selection: { [leftIdx]: rightValue } */
const DragMatchMission = ({ mission, selection, setSelection, locked }) => {
  const pairs = mission.pairs || [];
  const leftItems = pairs.map(p => p.left);
  const rightItems = useMemoMission(() => {
    const arr = pairs.map((p, i) => ({ value: p.right, originalIndex: i }));
    for (let i = arr.length - 1; i > 0; i--) {
      const j = (i * 7 + 3) % (i + 1);
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }, [pairs.length, JSON.stringify(pairs)]);

  const sel = (selection && typeof selection === 'object' && !Array.isArray(selection)) ? selection : {};
  const [draggedRight, setDraggedRight] = useStateMission(null);
  const [hoveredLeft, setHoveredLeft] = useStateMission(null);
  const [pickedRight, setPickedRight] = useStateMission(null);

  const usedRights = new Set(Object.values(sel));

  const dropOnLeft = (leftIndex, rightValue) => {
    if (locked) return;
    if (!rightValue) return;
    const newSel = { ...sel };
    Object.keys(newSel).forEach(k => {
      if (newSel[k] === rightValue) delete newSel[k];
    });
    newSel[leftIndex] = rightValue;
    setSelection(newSel);
    setDraggedRight(null);
    setHoveredLeft(null);
    setPickedRight(null);
  };

  const removeFromLeft = (leftIndex) => {
    if (locked) return;
    const newSel = { ...sel };
    delete newSel[leftIndex];
    setSelection(newSel);
  };

  return (
    <div>
      <div style={{
        marginTop: 12, fontFamily: 'var(--font-hand)', fontSize: 16,
        color: 'var(--ink-soft)', textAlign: 'center',
      }}>
        ✋ Bir kartı seç, sonra eşleştireceğin satıra dokun (ya da sürükle).
      </div>

      <div data-tk="dragmatch-grid" style={{
        marginTop: 22,
        display: 'grid',
        gridTemplateColumns: '1fr 1fr',
        gap: 26,
      }}>
        <div data-tk="dragmatch-rows" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div className="t-label" style={{ fontSize: 11 }}>Eşleştirme Satırları</div>
          {leftItems.map((leftLabel, li) => {
            const dropped = sel[li];
            const isHover = hoveredLeft === li;
            return (
              <div
                key={li}
                data-tk="dragmatch-row"
                onDragOver={(e) => { if (!locked) { e.preventDefault(); setHoveredLeft(li); } }}
                onDragLeave={() => setHoveredLeft(null)}
                onDrop={(e) => { e.preventDefault(); dropOnLeft(li, draggedRight); }}
                onClick={() => { if (!locked && pickedRight) dropOnLeft(li, pickedRight); }}
                style={{
                  display: 'flex', alignItems: 'center', gap: 12,
                  padding: 14,
                  border: '2px ' + (isHover ? 'solid' : 'dashed') + ' ' + (isHover ? 'var(--accent)' : 'var(--rule)'),
                  borderRadius: 12,
                  background: isHover ? '#FFF3E5' : 'var(--bg-cream)',
                  cursor: pickedRight && !locked ? 'pointer' : 'default',
                  minHeight: 64,
                  transition: 'background .15s, border-color .15s',
                }}
              >
                <div data-tk="dragmatch-row-left" style={{
                  flex: '0 0 auto',
                  fontFamily: 'var(--font-hand)', fontSize: 20, fontWeight: 700,
                  color: 'var(--title)', minWidth: 110,
                }}>
                  {leftLabel}
                </div>
                <div data-tk="dragmatch-row-right" style={{
                  flex: 1,
                  fontFamily: 'var(--font-body)', fontSize: 16, color: 'var(--ink)',
                }}>
                  {dropped ? (
                    <span
                      onClick={(e) => { e.stopPropagation(); removeFromLeft(li); }}
                      style={{
                        display: 'inline-flex', alignItems: 'center', gap: 8,
                        padding: '6px 12px',
                        background: 'var(--success)', color: '#FFF7EB',
                        borderRadius: 999, fontWeight: 700,
                        cursor: locked ? 'default' : 'pointer',
                      }}
                      title="Kaldırmak için tıkla"
                    >
                      ✓ {dropped} <span style={{ opacity: .8, fontSize: 14 }}>×</span>
                    </span>
                  ) : (
                    <span style={{ color: 'var(--ink-mute)', fontStyle: 'italic' }}>
                      buraya sürükle veya tıkla…
                    </span>
                  )}
                </div>
              </div>
            );
          })}
        </div>

        <div data-tk="dragmatch-options" style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <div className="t-label" style={{ fontSize: 11 }}>Seçenekler</div>
          {rightItems.map((r, idx) => {
            const used = usedRights.has(r.value);
            const isPicked = pickedRight === r.value;
            return (
              <div
                key={idx}
                data-tk="dragmatch-option"
                draggable={!locked && !used}
                onDragStart={() => !used && setDraggedRight(r.value)}
                onDragEnd={() => setDraggedRight(null)}
                onClick={() => {
                  if (locked || used) return;
                  setPickedRight(prev => prev === r.value ? null : r.value);
                }}
                style={{
                  padding: '12px 16px',
                  background: used ? '#E8DEC9' : (isPicked ? '#FFF3E5' : 'var(--bg-cream)'),
                  border: '2px solid ' + (isPicked ? 'var(--accent)' : (used ? 'var(--rule-soft)' : 'var(--ink-mute)')),
                  borderRadius: 12,
                  cursor: used ? 'default' : (locked ? 'default' : 'grab'),
                  fontFamily: 'var(--font-body)', fontSize: 16, color: used ? 'var(--ink-mute)' : 'var(--ink)',
                  textDecoration: used ? 'line-through' : 'none',
                  opacity: used ? 0.6 : 1,
                  transition: 'all .15s ease',
                  userSelect: 'none',
                }}
              >
                <span style={{ marginRight: 8, color: 'var(--ink-mute)' }}>⋮⋮</span>
                {r.value}
                {isPicked && !used && (
                  <span data-tk="dragmatch-picked-hint" style={{
                    marginLeft: 10, fontFamily: 'var(--font-hand)',
                    color: 'var(--accent)', fontWeight: 700,
                  }}>← şimdi solda bir satıra tıkla</span>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

/* ScenarioMission — story + single-choice */
const ScenarioMission = ({ mission, selection, setSelection, locked }) => {
  return (
    <div>
      {(mission.story || mission.scenario) && (
        <div className="card" style={{

/* MapMarkMission — TurkeyMap; sadece target + distractors tıklanabilir */
const MapMarkMission = ({ mission, selection, setSelection, locked }) => {
  const target = mission.targetRegionId
    || mission.correctRegion
    || (Array.isArray(mission.options) && typeof mission.correct === 'number' ? mission.options[mission.correct] : null);

  const distractors = Array.isArray(mission.distractors) ? mission.distractors : [];
  const selectable = useMemoMission(() => {
    const set = new Set(distractors);
    if (target) set.add(target);
    return Array.from(set);
  }, [target, JSON.stringify(distractors)]);

  return (
    <div>
      <div style={{
        marginTop: 12, fontFamily: 'var(--font-hand)', fontSize: 16,
        color: 'var(--ink-soft)', textAlign: 'center',
      }}>
        🗺 Haritada doğru bölgeye tıkla
      </div>
      <div style={{
        marginTop: 18,
        padding: 16,
        borderRadius: 16,
        background: 'var(--bg-cream)',
        border: '1.5px solid var(--rule)',
        boxShadow: 'var(--shadow-sm)',
      }}>
        {window.TurkeyMap ? (
          <window.TurkeyMap
            progress={{}}
            hoverable={!locked}
            selectableRegions={selectable}
            highlightRegion={selection}
            onRegionClick={(id) => !locked && setSelection(id)}
          />
        ) : (
          <div style={{ padding: 40, textAlign: 'center', color: 'var(--ink-mute)' }}>
            (Harita yüklenemedi)
          </div>
        )}
      </div>
      {selection && (
        <div style={{
          marginTop: 14, textAlign: 'center',
          fontFamily: 'var(--font-hand)', fontSize: 18, color: 'var(--accent)', fontWeight: 700,
        }}>
          Seçildi: <span style={{
            background: '#FFF3E5', padding: '2px 10px', borderRadius: 8,
            border: '1.5px solid var(--accent)',
          }}>
            {(window.REGIONS && window.REGIONS.find(r => r.id === selection) || {}).name || selection}
          </span>
        </div>
      )}
    </div>
  );
};

/* MissionScreen — router + akış */
const MissionScreen = ({ regionId, categoryId, missionIndex = 0, onMissionComplete, onAllMissionsComplete, onBackToMap }) => {
  const REGIONS = window.REGIONS || [];
  const REGIONS_CONTENT = window.REGIONS_CONTENT || {};
  const regionMeta = REGIONS.find(r => r.id === regionId) || {};
  const regionData = REGIONS_CONTENT[regionId] || {};
  // Grade+category-aware: 3 missions from the specific category bucket of the grade pool
  const missionList = (categoryId && window.getMissionsForCategory ? window.getMissionsForCategory(regionId, categoryId) :
    (window.getMissionsForGame ? window.getMissionsForGame(regionId) : null)) ||
    (Array.isArray(regionData.missions) ? regionData.missions : []);
  const mission = missionList[missionIndex] || null;
  const totalMissions = Math.max(missionList.length, 3);
  const isLastMission = missionIndex >= totalMissions - 1;

  const [selection, setSelection] = useStateMission(null);
  const [feedback, setFeedback] = useStateMission(null);
  const [hintShown, setHintShown] = useStateMission(false);
  const [attempts, setAttempts] = useStateMission(0);
  const startTimeRef = useRefMission(Date.now());
  const completedRef = useRefMission(false);

  useEffectMission(() => {
    setSelection(null);
    setFeedback(null);
    setHintShown(false);
    setAttempts(0);
    startTimeRef.current = Date.now();
    completedRef.current = false;
  }, [regionId, categoryId, missionIndex]);

  if (!mission) {
    return (
      <div className="paper-cream" style={{
        minHeight: '100vh', display: 'grid', placeItems: 'center',
        fontFamily: 'var(--font-body)', padding: 40, textAlign: 'center',
      }}>
        <div>
          <div style={{ fontFamily: 'var(--font-display)', fontSize: 48, color: 'var(--title)' }}>
            Görev bulunamadı
          </div>
          <div style={{ marginTop: 8, color: 'var(--ink-mute)' }}>
            Bölge: {regionId || '—'} · İndeks: {missionIndex}
          </div>
          <button
            className="btn btn-primary"
            style={{ marginTop: 22 }}
            onClick={() => typeof onBackToMap === 'function' && onBackToMap()}
          >
            ← Haritaya Dön
          </button>
        </div>
      </div>
    );
  }

  const isAnswerCorrect = () => {
    if (selection === null || selection === undefined) return false;
    switch (mission.type) {
      case 'single-choice':
      case 'scenario':
        return selection === mission.correct;
      case 'multi-select':
        return arraysEqualAsSets(selection, mission.correct || []);
      case 'drag-match': {
        const pairs = mission.pairs || [];
        if (!selection || typeof selection !== 'object') return false;
        for (let i = 0; i < pairs.length; i++) {
          if (selection[i] !== pairs[i].right) return false;
        }
        return Object.keys(selection).length === pairs.length;
      }
      case 'map-mark': {
        const target = mission.targetRegionId
          || mission.correctRegion
          || (Array.isArray(mission.options) && typeof mission.correct === 'number' ? mission.options[mission.correct] : null);
        return selection === target;
      }
      default:
        return false;
    }
  };

  const hasSelection = (() => {
    if (selection === null || selection === undefined) return false;
    if (Array.isArray(selection)) return selection.length > 0;
    if (typeof selection === 'object') return Object.keys(selection).length > 0;
    return true;
  })();

  const isLocked = feedback === 'correct';

  const handleCheck = () => {
    if (!hasSelection || isLocked) return;
    const correct = isAnswerCorrect();
    const newAttempts = attempts + 1;
    setAttempts(newAttempts);
    if (correct) {
      setFeedback('correct');
      if (completedRef.current) return;
      completedRef.current = true;
      const timeMs = Date.now() - startTimeRef.current;
      setTimeout(() => {
        // Derive category from mission's original pool index (cat = floor(origIdx/3))
        // ÖNEMLİ: getCategoriesForRegion() kullan — grade-aware id'ler (cat0..cat4) JourneyMap ile uyumlu olsun.
        const cats = (window.getCategoriesForRegion ? window.getCategoriesForRegion(regionId) :
                      ((window.CATEGORIES_BY_REGION && window.CATEGORIES_BY_REGION[regionId]) || []));
        const origIdx = (mission && typeof mission._origIdx === 'number') ? mission._origIdx : -1;
        const catIdx = origIdx >= 0 ? Math.floor(origIdx / 3) : -1;
        const derivedCatId = (catIdx >= 0 && cats[catIdx]) ? cats[catIdx].id : null;
        if (typeof onMissionComplete === 'function') {
          onMissionComplete(true, newAttempts, timeMs, derivedCatId);
        }
        if (isLastMission && typeof onAllMissionsComplete === 'function') {
          onAllMissionsComplete();
        }
      }, 800);
    } else {
      setFeedback('wrong');
      setTimeout(() => setFeedback(null), 600);
    }
  };

  const handleHint = () => setHintShown(true);

  const handleBack = () => {
    if (typeof onBackToMap === 'function') onBackToMap();
  };

  const renderSubMission = () => {
    const props = { mission, selection, setSelection, locked: isLocked };
    switch (mission.type) {
      case 'single-choice': return <SingleChoiceMission {...props}/>;
      case 'multi-select':  return <MultiSelectMission {...props}/>;
      case 'drag-match':    return <DragMatchMission {...props}/>;
      case 'scenario':      return <ScenarioMission {...props}/>;
      case 'map-mark':      return <MapMarkMission {...props}/>;
      default:
        return (
          <div style={{ marginTop: 22, padding: 20, color: 'var(--ink-mute)', textAlign: 'center' }}>
            Bilinmeyen görev tipi: <code>{String(mission.type)}</code>
          </div>
        );
    }
  };

  const regionColor = regionMeta.color || 'var(--accent)';
  const missionTypeLabel = ({
    'single-choice': 'Tek Seçim',
    'multi-select':  'Çoklu Seçim',
    'drag-match':    'Eşleştirme',
    'scenario':      'Hikâye Görevi',
    'map-mark':      'Harita Görevi',
  })[mission.type] || 'Mini Görev';

  const missionTitle = (regionData.intro && regionData.intro.missionTitle) || 'Mini Görev';
  const regionBadge = regionMeta.badge || '🎯';

  return (
    <div
      className="paper-cream"
      style={{
        minHeight: '100vh',
        position: 'relative',
        overflow: 'hidden',
        fontFamily: 'var(--font-body)',
        color: 'var(--ink)',
        paddingBottom: 80,
      }}
    >
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        padding: '16px 32px',
        borderBottom: '1.5px dashed var(--rule)',
        background: 'rgba(250,246,236,.7)',
        flexWrap: 'wrap', gap: 12,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, flexWrap: 'wrap' }}>
          <button
            className="btn btn-secondary btn-sm"
            onClick={handleBack}
            aria-label="Haritaya geri dön"
          >
            ← Haritaya Dön
          </button>
          <div style={{
            fontFamily: 'var(--font-hand)',
            fontSize: 22,
            color: regionColor,
            fontWeight: 700,
          }}>
            {regionBadge} {regionMeta.name || regionId} · {missionTitle}
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span className="t-label" style={{ fontSize: 12 }}>Görev</span>
          {Array.from({ length: totalMissions }).map((_, i) => {
            const active = i === missionIndex;
            const done = i < missionIndex;
            return (
              <div key={i} style={{
                width: 30, height: 30, borderRadius: '50%',
                border: '1.5px solid ' + (active ? 'var(--accent)' : 'var(--ink-mute)'),
                background: active ? 'var(--accent)' : (done ? 'var(--success)' : 'transparent'),
                color: (active || done) ? '#FFF7EB' : 'var(--ink-mute)',
                display: 'grid', placeItems: 'center',
                fontFamily: 'var(--font-hand)', fontWeight: 700, fontSize: 14,
              }}>{done ? '✓' : (i + 1)}</div>
            );
          })}
          <span className="t-label" style={{ fontSize: 12 }}>
            {missionIndex + 1} / {totalMissions}
          </span>
        </div>
      </div>

      <div
        className={feedback === 'wrong' ? 'tk-mission-shake' : ''}
        style={{
          maxWidth: 920, margin: '0 auto', padding: '36px 32px 24px',
          position: 'relative',
        }}
      >
        <div className="t-label" style={{ fontSize: 12, textAlign: 'center' }}>
          Mini Görev — {missionTypeLabel}
        </div>
        <h1 style={{
          fontFamily: 'var(--font-display)', fontSize: 48, lineHeight: 1.05,
          color: 'var(--title)', textAlign: 'center', margin: '6px 0 4px',
        }}>
          {mission.title || mission.question || mission.prompt || 'Görev'}
        </h1>
        {mission.title && (mission.prompt || mission.question) && (
          <div style={{
            textAlign: 'center', fontFamily: 'var(--font-hand)', fontSize: 18,
            color: 'var(--ink-soft)',
          }}>
            {mission.prompt || mission.question}
          </div>
        )}

        <div
          className={feedback === 'correct' ? 'tk-mission-pulse-correct' : ''}
          style={{
            marginTop: 8,
            padding: 4,
            borderRadius: 16,
            border: '2px solid transparent',
            transition: 'border-color .25s',
            position: 'relative',
          }}
        >
          {renderSubMission()}

          {feedback === 'correct' && window.Sparkle && (
            <div style={{
              position: 'absolute', inset: 0, pointerEvents: 'none',
              display: 'flex', justifyContent: 'space-around',
              color: 'var(--warn)',
            }}>
              {[0, 1, 2, 3, 4].map(i => (
                <div key={i} className="tk-sparkle"
                  style={{
                    marginTop: 20 + (i % 3) * 30,
                    color: ['#F9A825', '#558B2F', '#C62828', '#FFA726', '#B8862F'][i],
                  }}>
                  <window.Sparkle size={20 + (i % 3) * 6}/>
                </div>
              ))}
            </div>
          )}
        </div>

        {hintShown && mission.hint && (
          <div style={{
            marginTop: 18,
            padding: '14px 18px',
            background: '#FFF7D6',
            border: '1.5px solid var(--warn)',
            borderRadius: 12,
            display: 'flex', gap: 12, alignItems: 'flex-start',
            boxShadow: 'var(--shadow-sm)',
          }}>
            <div style={{ fontSize: 24, lineHeight: 1 }}>💡</div>
            <div>
              <div className="t-label" style={{ fontSize: 11, color: 'var(--gold)' }}>İpucu</div>
              <div style={{ fontFamily: 'var(--font-body)', fontSize: 16, color: 'var(--ink)' }}>
                {mission.hint}
              </div>
            </div>
          </div>
        )}

        {feedback === 'wrong' && (
          <div style={{
            marginTop: 14, padding: '10px 14px',
            background: 'rgba(198,40,40,.08)', border: '1.5px solid var(--accent)',
            borderRadius: 10, color: 'var(--accent)', fontWeight: 700,
            fontFamily: 'var(--font-hand)', fontSize: 18, textAlign: 'center',
          }}>
            ✕ Henüz değil — tekrar dene!
          </div>
        )}

        {feedback === 'correct' && (
          <div style={{
            marginTop: 14, padding: '10px 14px',
            background: 'rgba(85,139,47,.10)', border: '1.5px solid var(--success)',
            borderRadius: 10, color: 'var(--success)', fontWeight: 700,
            fontFamily: 'var(--font-hand)', fontSize: 20, textAlign: 'center',
          }}>
            ✓ Harika! Doğru cevap.
          </div>
        )}

        <div data-tk="mission-action" style={{
          marginTop: 24,
          display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          gap: 14, flexWrap: 'wrap',
        }}>
          <div>
            {!hintShown && mission.hint && (
              <button className="btn btn-tertiary" onClick={handleHint}>
                💡 Bir ipucu kullan
              </button>
            )}
            {hintShown && (
              <span className="t-label" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>
                ✓ İpucu kullanıldı
              </span>
            )}
          </div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            {attempts > 0 && feedback !== 'correct' && (
              <span className="t-label" style={{ fontSize: 11, color: 'var(--ink-mute)' }}>
                Deneme: {attempts}
              </span>
            )}
            <button
              className={'btn ' + (hasSelection && !isLocked ? 'btn-primary' : 'btn-disabled') + ' btn-lg'}
              onClick={handleCheck}
              disabled={!hasSelection || isLocked}
              aria-label="Cevabı kontrol et"
            >
              Cevabı Kontrol Et →
            </button>
          </div>
        </div>
      </div>

      <div style={{
        position: 'absolute', bottom: 14, right: 24,
        fontFamily: 'var(--font-hand)', color: 'var(--ink-mute)', fontSize: 16,
      }}>
        — sayfa {missionIndex + 1} —
      </div>
    </div>
  );
};

Object.assign(window, { MissionScreen });
  </script>

  <!-- ============================================================
       7) src/app.jsx — Ana App, ekran routing
       ============================================================ -->
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const ComingSoonPlaceholder = ({ screenName, info }) => (
  <div style={{
    minHeight: '100vh',
    display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
    padding: '40px 24px', textAlign: 'center',
    background: 'var(--bg-paper)',
    fontFamily: 'var(--font-body)',
  }}>
    <div style={{
      fontFamily: 'var(--font-display)', fontSize: 56, color: 'var(--title)', marginBottom: 8
    }}>Yakında...</div>
    <div style={{ fontFamily: 'var(--font-hand)', fontSize: 22, color: 'var(--ink-soft)' }}>
      {screenName} ekranı henüz hazır değil
    </div>
    {info && (
      <div style={{ marginTop: 16, color: 'var(--ink-mute)', fontSize: 14, maxWidth: 480 }}>
        {info}
      </div>
    )}
  </div>
);

const WelcomePlaceholder = ({ onStart, hasSavedGame, playerName }) => {
  const [name, setName] = useState(playerName || '');
  return (
    <div className="paper" style={{
      minHeight: '100vh', position: 'relative', overflow: 'hidden',
      fontFamily: 'var(--font-body)', color: 'var(--ink)',
      padding: '48px 24px',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
    }}>
      {window.CornerOrnament && <window.CornerOrnament className="corner tl"/>}
      {window.CornerOrnament && <window.CornerOrnament className="corner tr"/>}
      {window.CornerOrnament && <window.CornerOrnament className="corner bl"/>}
      {window.CornerOrnament && <window.CornerOrnament className="corner br"/>}

      <div className="float" style={{ marginTop: 8 }}>
        {window.Logo && <window.Logo size={200}/>}
      </div>

      <div style={{
        fontFamily: 'var(--font-display)', fontSize: 64, lineHeight: 0.9,
        color: 'var(--title)', textShadow: '1px 2px 0 rgba(184,134,47,.18)',
        marginTop: 8, textAlign: 'center',
      }}>
        Türkiye'yi Keşfet
      </div>
      <div style={{
        fontFamily: 'var(--font-hand)', fontSize: 22, color: 'var(--ink-soft)',
        fontStyle: 'italic', marginTop: 4
      }}>
        ✦ Bir Coğrafya Macerası ✦
      </div>

      <div className="card deckle" style={{
        maxWidth: 560, marginTop: 24, position: 'relative',
        background: 'var(--bg-cream)',
        borderColor: 'var(--rule)',
      }}>
        <div style={{
          position: 'absolute', top: -14, left: 24,
          background: 'var(--accent)', color: '#FFF7EB',
          padding: '3px 12px', fontFamily: 'var(--font-hand)', fontSize: 14,
          letterSpacing: '.15em', borderRadius: 6, transform: 'rotate(-2deg)',
        }}>
          GÖREV BRİFİ
        </div>
        <p style={{ margin: 0, fontSize: 16, lineHeight: 1.6, color: 'var(--ink)' }}>
          Türkiye Coğrafya Akademisi seni <b style={{color: 'var(--accent)'}}>"Coğrafya Ustası"</b> adayı olarak seçti.
          7 bölgeyi keşfedip her birinden bir <b>uzmanlık rozeti</b> kazanman gerekiyor!
        </p>
      </div>

      <div style={{ marginTop: 22, width: 360, maxWidth: '100%' }}>
        <label className="t-label" style={{ display: 'block', fontSize: 12, marginBottom: 6 }}>
          Maceracı adın
        </label>
        <input
          className="input"
          placeholder="örn. Mehmet Ali"
          value={name}
          onChange={(e) => setName(e.target.value)}
          aria-label="Maceracı adı"
        />
      </div>

      <div style={{ marginTop: 18, display: 'flex', gap: 12, flexWrap: 'wrap', justifyContent: 'center' }}>
        <button
          className="btn btn-primary btn-lg"
          onClick={() => onStart(name.trim() || 'Maceracı')}
          disabled={!name.trim()}
        >
          🎒 Maceraya Başla
        </button>
        {hasSavedGame && (
          <button
            className="btn btn-secondary btn-lg"
            onClick={() => onStart(playerName || name.trim() || 'Maceracı')}
          >
            📖 Devam Et
          </button>
        )}
      </div>

      <div style={{ marginTop: 16, fontFamily: 'var(--font-hand)', fontSize: 15, color: 'var(--ink-mute)' }}>
        Anadolu'nun her bir bölgesinde seni bir hikâye bekliyor…
      </div>

      <div style={{
        marginTop: 24, padding: '8px 14px', background: 'rgba(184,134,47,.08)',
        border: '1px dashed var(--rule)', borderRadius: 8,
        fontSize: 12, color: 'var(--ink-mute)', maxWidth: 480, textAlign: 'center'
      }}>
        <b>M1 Altyapı modülü aktif.</b> Map / RegionIntro / Mission / Badge / Quiz / Final ekranları sonraki modüllerde eklenecek.
      </div>
    </div>
  );
};

const App = () => {
  const progress = window.useProgress();
  const [screen, setScreen] = useState(window.SCREENS.WELCOME);
  const [activeRegion, setActiveRegion] = useState(null);
  const [missionIndex, setMissionIndex] = useState(0);
  const [activeCategory, setActiveCategory] = useState(null);

  const goToWelcome = () => setScreen(window.SCREENS.WELCOME);
  const goToMap = () => setScreen(window.SCREENS.MAP);
  const goToRegion = (id) => { setActiveRegion(id); setScreen(window.SCREENS.REGION_INTRO); };
  const goToMission = (index = 0) => { setMissionIndex(index); setScreen(window.SCREENS.MISSION); };
  const nextMission = () => setMissionIndex(prev => prev + 1);
  const goToBadge = () => setScreen(window.SCREENS.BADGE);
  const goToQuiz = () => setScreen(window.SCREENS.QUIZ);
  const goToFinal = () => setScreen(window.SCREENS.FINAL);

  const handleStart = (name, grade, isNewIdentity) => {
    if (isNewIdentity && progress.reset) {
      progress.reset();
      if (typeof window !== 'undefined' && typeof window.resetGameOrder === 'function') {
        window.resetGameOrder();
      }
    }
    progress.setPlayerName(name);
    if (typeof grade === 'number' && progress.setGrade) {
      progress.setGrade(grade);
    }
    goToMap();
  };

  const renderScreen = () => {
    switch (screen) {
      case window.SCREENS.WELCOME: {
        if (window.WelcomeScreen) {
          return (
            <window.WelcomeScreen
              progressInstance={progress}
              onStart={handleStart}
              hasSavedGame={progress.hasSavedGame()}
              playerName={progress.state.playerName}
            />
          );
        }
        return (
          <WelcomePlaceholder
            onStart={handleStart}
            hasSavedGame={progress.hasSavedGame()}
            playerName={progress.state.playerName}
          />
        );
      }
      case window.SCREENS.MAP: {
        if (window.MapScreen) {
          return (
            <window.MapScreen
              progressInstance={progress}
              progress={progress.getProgressMap()}
              playerName={progress.state.playerName}
              earned={progress.earnedBadgeCount()}
              regionsProgress={progress.state.regionsProgress || {}}
              selectedRegion={activeRegion || 'marmara'}
              onRegionClick={goToRegion}
              onCategorySelect={(rid, catId) => {
                setActiveRegion(rid);
                setActiveCategory(catId);
                setMissionIndex(0);
                setScreen(window.SCREENS.MISSION);
              }}
              onAllComplete={goToQuiz}
            />
          );
        }
        return <ComingSoonPlaceholder screenName="Harita (Map)" info="M2'de geliştirilecek." />;
      }
      case window.SCREENS.REGION_INTRO: {
        if (window.RegionIntroScreen) {
          return (
            <window.RegionIntroScreen
              regionId={activeRegion}
              onStartMission={(categoryId) => categoryId ? goToCategoryMission(categoryId) : goToMission(0)}
              onClose={goToMap}
            />
          );
        }
        return <ComingSoonPlaceholder screenName="Bölge Tanıtımı" info="M3a'da geliştirilecek." />;
      }
      case window.SCREENS.MISSION: {
        if (window.MissionScreen) {
          return (
            <window.MissionScreen
              regionId={activeRegion}
              categoryId={activeCategory}
              missionIndex={missionIndex}
              onMissionComplete={(correct, attempts, timeMs, derivedCatId) => {
                // 1) Eski moduldeki gibi mission attempt kaydı (DBR loglar için)
                progress.recordMissionAttempt(activeRegion, missionIndex, correct, timeMs);
                // 2) Yeni: doğru cevap ise kategoriye kredi ver (mixed flow için _origIdx ile türetilen, focused flow için activeCategory)
                if (correct) {
                  const targetCat = derivedCatId || activeCategory;
                  if (targetCat && progress.recordCategoryAnswer) {
                    progress.recordCategoryAnswer(activeRegion, targetCat, true);
                  }
                }
                nextMission();
              }}
              onAllMissionsComplete={() => {
                // 3 görev bitti — o bölgenin random cache'ini temizle ki sonraki tur farklı sorular gelsin
                if (typeof window.resetRegionGameOrder === 'function') {
                  window.resetRegionGameOrder(activeRegion);
                }
                // Bölgede tüm kategoriler done mu? Eğer öyleyse badge ceremony
                const allCats = (window.getCategoriesForRegion ? window.getCategoriesForRegion(activeRegion) :
                  ((window.CATEGORIES_BY_REGION && window.CATEGORIES_BY_REGION[activeRegion]) || []));
                const allDone = allCats.length > 0 && allCats.every(c => progress.isCategoryDone && progress.isCategoryDone(activeRegion, c.id));
                if (allDone) {
                  goToBadge();
                } else {
                  // Kategori/tur bitti — focused mod'daysak RegionIntro yerine direkt Map'e dön (yolculuk haritasından devam etsin)
                  // Mixed mod'daysak da Map'e dön — RegionIntro'da "Göreve Başla" tekrar tıklamak için
                  setActiveCategory(null);
                  goToMap();
                }
              }}
              onBackToMap={goToMap}
            />
          );
        }
        return <ComingSoonPlaceholder screenName="Mini Görev" info="M4'te geliştirilecek." />;
      }
      case window.SCREENS.BADGE: {
        if (window.BadgeCeremonyScreen) {
          return (
            <window.BadgeCeremonyScreen
              regionId={activeRegion}
              earnedCount={progress.earnedBadgeCount()}
              totalCount={7}
              onContinue={goToMap}
              onCompleteRegion={(rid) => progress.completeRegion(rid)}
            />
          );
        }
        return <ComingSoonPlaceholder screenName="Rozet Töreni" info="M5'te geliştirilecek." />;
      }
      case window.SCREENS.QUIZ: {
        if (window.QuizScreen) {
          return (
            <window.QuizScreen
              questions={window.FINAL_QUIZ}
              onComplete={(score, timeMs) => { progress.setQuizScore(score); goToFinal(); }}
            />
          );
        }
        return <ComingSoonPlaceholder screenName="Final Quiz" info="M5'te geliştirilecek." />;
      }
      case window.SCREENS.FINAL: {
        if (window.FinalScreen) {
          return (
            <window.FinalScreen
              playerName={progress.state.playerName}
              quizScore={progress.state.quizScore}
              startedAt={progress.state.startedAt}
              onPlayAgain={() => { progress.reset(); goToWelcome(); }}
              onShare={() => {
                try { alert('Sonuçlar (kopyala):\n\n' + progress.exportJson()); }
                catch (e) { console.warn(e); }
              }}
            />
          );
        }
        return <ComingSoonPlaceholder screenName="Final" info="M5'te geliştirilecek." />;
      }
      default:
        return <ComingSoonPlaceholder screenName="Bilinmeyen ekran" />;
    }
  };

  return renderScreen();
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>

  <!-- ============================================================
       PWA: Service Worker registration
       (file:// protokolünde çalışmaz; HTTPS / localhost gerekir.)
       ============================================================ -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js', { scope: './' })
          .then((reg) => {
            console.log('[PWA] Service Worker registered:', reg.scope);
            // Yeni SW'yi otomatik aktive et
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage('SKIP_WAITING');
                  }
                });
              }
            });
          })
          .catch((err) => console.warn('[PWA] SW registration failed:', err));

        // SW kontrolör değişince sayfayı sessizce yenile
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }
  </script>
