<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Türkiye'yi Keşfet — Bir Coğrafya Macerası</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#5D2E2E" />
  <meta name="application-name" content="Türkiye'yi Keşfet" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Patrick+Hand&family=Quicksand:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Stil -->
  <link rel="stylesheet" href="styles.css" />

  <!-- Leaflet (real geographic map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />

  <!-- React 18 + Babel-standalone (CDN, integrity attribute YOK — sorun çıkartmıştı) -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Yükleme placeholder'ı: #root boş kaldığında gösterilir */
    

    /* Mobile: butonları ortala (RegionIntro Göreve Başla + Mission Cevabı Kontrol Et) */
    @media (max-width: 767px) {
      [data-tk="region-intro-action"],
      [data-tk="mission-action"] {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 12px !important;
      }
      [data-tk="region-intro-action"] > div,
      [data-tk="mission-action"] > div {
        width: 100% !important;
        text-align: center !important;
        display: flex !important;
        justify-content: center !important;
      }
      [data-tk="region-intro-action"] > button,
      [data-tk="mission-action"] > div > button {
        width: 100% !important;
        max-width: 320px !important;
        margin: 0 auto !important;
        align-self: center !important;
      }
      [data-tk="mission-action"] > div:last-child {
        flex-direction: column !important;
        gap: 6px !important;
      }
    }

    /* Mobile: drag-match question — single column stack + compact */
    @media (max-width: 767px) {
      [data-tk="dragmatch-grid"] {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
        margin-top: 14px !important;
      }
      [data-tk="dragmatch-row"] {
        padding: 10px 12px !important;
        min-height: 54px !important;
        gap: 10px !important;
      }
      [data-tk="dragmatch-row-left"] {
        min-width: 0 !important;
        max-width: 40% !important;
        font-size: 16px !important;
        line-height: 1.15 !important;
      }
      [data-tk="dragmatch-row-right"] {
        font-size: 14px !important;
        line-height: 1.25 !important;
      }
      [data-tk="dragmatch-row-right"] span {
        font-size: 13px !important;
      }
      [data-tk="dragmatch-option"] {
        padding: 10px 12px !important;
        font-size: 14px !important;
        line-height: 1.3 !important;
      }
      /* Picked-hint label uzun ve kayar — mobilde gizle, accent border zaten yeterli sinyal */
      [data-tk="dragmatch-picked-hint"] {
        display: none !important;
      }
      /* "Sağdaki kartları sürükle ya da tıkla…" yerine tap-flow odaklı metin için label'ı yeniden konumlama */
      [data-tk="dragmatch-options"] .t-label,
      [data-tk="dragmatch-rows"] .t-label {
        font-size: 10px !important;
        margin-bottom: -4px !important;
      }
    }

    /* Mobil tap highlight + focus outline'ı kaldır (Leaflet polygon'larında çizgi bırakmasın) */
    .leaflet-container,
    .leaflet-container *,
    .leaflet-interactive,
    .leaflet-clickable {
      -webkit-tap-highlight-color: transparent !important;
    }
    .leaflet-interactive:focus,
    .leaflet-interactive:focus-visible,
    .leaflet-marker-icon:focus,
    .leaflet-container path:focus,
    .leaflet-container *:focus {
      outline: none !important;
    }

    #root:empty::before {
      content: "Yükleniyor…";
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Patrick Hand', cursive;
      font-size: 24px;
      color: #5D2E2E;
      background: #F5F0E1;
    }

    /* iOS safe-area desteği */
    body {
      padding-top: env(safe-area-inset-top, 0);
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    /* ===========================================================
       MOBİL RESPONSIVE — DESKTOP'I BOZMADAN MOBİLE OPTİMİZASYON
       =========================================================== */

    /* Tablet ve altı (< 1024px) — yatay padding'leri azalt */
    @media (max-width: 1023px) {
      .paper {
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
    }

    /* Mobile (< 768px) */
    @media (max-width: 767px) {
      /* TopBar: badges ve etiketleri küçült */
      [data-tk="topbar"] {
        padding: 8px 10px !important;
        gap: 6px !important;
        flex-wrap: nowrap !important;
      }
      [data-tk="topbar-rozetler"] { display: none !important; }
      [data-tk="topbar-badges"] { gap: 3px !important; }
      [data-tk="topbar-badges"] > div {
        width: 22px !important;
        height: 22px !important;
        font-size: 10px !important;
        border-width: 1.5px !important;
      }
      [data-tk="journey-button"] {
        padding: 5px 8px !important;
        font-size: 11px !important;
      }
      [data-tk="journey-button-text"] { display: none !important; }

      /* Çantam alanı: sadece emoji */
      [data-tk="chantam-name"] { display: none !important; }
      [data-tk="chantam-label"] { display: none !important; }

      /* Map sayfası: kenar padding'ler + harita yüksekliği daraltıldı */
      [data-tk="map-header"] {
        padding: 4px 12px 0 !important;
      }
      [data-tk="map-headline"] { font-size: 18px !important; line-height: 1 !important; }
      [data-tk="map-teaser"] {
        font-size: 11px !important;
        max-width: 100% !important;
        text-align: left !important;
        line-height: 1.25 !important;
      }
      [data-tk="map-wrapper"] {
        padding: 4px 8px !important;
        max-height: 55vh !important;
        min-height: 260px !important;
      }
      [data-tk="map-card"] {
        padding: 3px !important;
      }

      /* JourneyMap: alt — yatay scroll'a izin ver */
      [data-tk="journey-map"] {
        padding: 6px 10px 8px !important;
      }
      [data-tk="journey-map-grid"] {
        grid-template-columns: repeat(5, minmax(110px, 1fr)) !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        scroll-snap-type: x mandatory !important;
      }
      [data-tk="journey-map-grid"] > button {
        scroll-snap-align: start !important;
        min-width: 110px !important;
      }

      /* Welcome: dikey istif, küçük margin */
      [data-tk="welcome"] { padding: 16px !important; }
      [data-tk="welcome-title"] { font-size: 56px !important; line-height: 0.9 !important; }
      [data-tk="welcome-subtitle"] { font-size: 18px !important; }
      [data-tk="welcome-card"] { max-width: 100% !important; padding: 14px !important; }
      [data-tk="welcome-card"] p { font-size: 14px !important; line-height: 1.45 !important; }
      [data-tk="welcome-row"] {
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 12px !important;
      }
      [data-tk="welcome-row"] > div { flex: 1 1 100% !important; }
      [data-tk="welcome-grade-buttons"] button {
        padding: 10px 4px !important;
        font-size: 18px !important;
      }

      /* RegionIntro modal */
      [data-tk="region-intro-modal"] {
        max-width: 100% !important;
        width: calc(100% - 16px) !important;
        max-height: calc(100vh - 16px) !important;
      }
      [data-tk="region-intro-content"] {
        padding: 14px 16px 18px !important;
      }
      [data-tk="region-intro-title"] { font-size: 32px !important; }
      [data-tk="region-intro-mission"] { font-size: 16px !important; }
      [data-tk="region-intro-facts"] {
        grid-template-columns: 1fr !important;
        gap: 8px !important;
      }
      [data-tk="region-intro-facts"] > div { padding: 8px 12px !important; }
      [data-tk="region-intro-facts"] [class~="t-label"] { font-size: 10px !important; }

      /* Mission ekranı */
      [data-tk="mission"] { padding: 12px !important; }
      [data-tk="mission-question"] { font-size: 22px !important; line-height: 1.3 !important; }
      [data-tk="mission-options"] button { padding: 10px 12px !important; font-size: 15px !important; }
      [data-tk="mission-options"] button > div:first-child { width: 26px !important; height: 26px !important; font-size: 13px !important; }
      [data-tk="mission-progress"] > div { width: 22px !important; height: 22px !important; font-size: 12px !important; }
      [data-tk="mission-back-btn"] { padding: 4px 8px !important; font-size: 12px !important; }

      /* BackpackModal */
      [data-tk="backpack-modal"] {
        max-width: 100% !important;
        width: calc(100% - 16px) !important;
      }
      [data-tk="backpack-stats"] {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;
      }

      /* AllJourneyModal */
      [data-tk="alljourney-modal"] {
        max-width: 100% !important;
        width: calc(100% - 16px) !important;
        max-height: calc(100vh - 16px) !important;
      }
      [data-tk="alljourney-grid"] {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }

      /* Quiz */
      [data-tk="quiz-options"] {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }
      [data-tk="quiz-question"] { font-size: 22px !important; }

      /* BadgeCeremony */
      [data-tk="badge-title"] { font-size: 56px !important; }
      [data-tk="badge-subtitle"] { font-size: 22px !important; }

      /* Final */
      [data-tk="final-title"] { font-size: 52px !important; }
      [data-tk="final-stats"] {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }

      /* Logo küçült */
      [data-tk="welcome"] svg { max-width: 200px !important; height: auto !important; }
    }

    /* Çok küçük ekranlar (< 380px) */
    @media (max-width: 380px) {
      [data-tk="welcome-title"] { font-size: 44px !important; }
      [data-tk="map-headline"] { font-size: 18px !important; }
      [data-tk="region-intro-title"] { font-size: 26px !important; }
      [data-tk="mission-question"] { font-size: 18px !important; }
    }

    /* Yatay (landscape) mobile */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      [data-tk="welcome"] svg { max-width: 100px !important; height: auto !important; }
      [data-tk="welcome-title"] { font-size: 36px !important; }
      [data-tk="welcome-subtitle"] { font-size: 14px !important; }
      [data-tk="welcome-card"] { margin-top: 8px !important; padding: 8px !important; }
      [data-tk="welcome-card"] p { font-size: 12px !important; }
    }

    /* PWA standalone modunda safe-area */
    @media (display-mode: standalone) {
      body { user-select: none; -webkit-user-select: none; }
    }
  </style>
</head>

/* Kategoriye göre soru havuzu — pool'u 5 segmente böler.
   cat0 = [0,1,2], cat1 = [3,4,5], cat2 = [6,7,8], cat3 = [9,10,11], cat4 = [12,13,14] */
const getMissionsForCategory = (regionId, categoryId) => {
  const cats = (window.getCategoriesForRegion ? window.getCategoriesForRegion(regionId) : (CATEGORIES_BY_REGION[regionId] || []));
  const catIdx = cats.findIndex(c => c.id === categoryId);
  if (catIdx < 0) return [];
  const grade = (function(){
    try { const raw = localStorage.getItem("tk_state"); if (raw) { const g = parseInt(JSON.parse(raw).grade, 10); if (g>=5 && g<=8) return g; } } catch(e){}
    return 5;
  })();
  const graded = window.REGIONS_CONTENT_GRADED && window.REGIONS_CONTENT_GRADED[regionId];
  let pool = null;
  if (graded && graded.missionsByGrade && graded.missionsByGrade[grade] && graded.missionsByGrade[grade].length) {
    pool = graded.missionsByGrade[grade];
  } else if (window.REGIONS_CONTENT && window.REGIONS_CONTENT[regionId]) {
    pool = window.REGIONS_CONTENT[regionId].missions || [];
  }
  if (!pool || pool.length === 0) return [];
  const start = catIdx * 3;
  // Tag each mission with its original index so the recorder knows the category.
  return pool.slice(start, start + 3).map((m, i) => ({ ...m, _origIdx: start + i }));
};

Object.assign(window, { CATEGORIES_BY_REGION, getMissionsForCategory });

};

/* Sınıfa göre topic icons döndüren helper. */
const getTopicIconsForRegion = (regionId) => {
  let grade = 5;
  try {
    const raw = localStorage.getItem("tk_state");
    if (raw) {
      const g = parseInt(JSON.parse(raw).grade, 10);
      if (g >= 5 && g <= 8) grade = g;
    }
  } catch(e) {}
  const set = (window.REGION_TOPIC_ICONS_GRADED || {})[grade] ||
              (window.REGION_TOPIC_ICONS_GRADED || {})[5];
  if (set && set[regionId]) return set[regionId];
  // Fallback to legacy flat REGION_TOPIC_ICONS
  return (window.REGION_TOPIC_ICONS && window.REGION_TOPIC_ICONS[regionId]) || [];
};
Object.assign(window, { getTopicIconsForRegion });

const TurkeyMap = ({
  progress = {},
  hoverable = true,
  onRegionClick = null,
  decorative = false,
  mapSrc, /* legacy, unused with Leaflet */
  selectableRegions = null,
  highlightRegion = null,
  height = 420,
}) => {
  const containerRef = useRefLib(null);
  const mapRef = useRefLib(null);
  const layerRef = useRefLib(null);
  const markersRef = useRefLib([]);
  const topicMarkersRef = useRefLib([]);
  const topicClusterRef = useRefLib(null);
  const propsRef = useRefLib({ progress, onRegionClick, selectableRegions, hoverable });
  const pathToRegionRef = useRefLib(new Map());
  const touchHoverTimerRef = useRefLib(null);
  const [hovered, setHovered] = useStateLib(null);

  useEffectLib(() => {
    propsRef.current = { progress, onRegionClick, selectableRegions, hoverable };
  });

  const computeStyle = (feature) => {
    const region = feature.properties.region;
    const status = progress[region] || "open";
    const isHL = highlightRegion === region || hovered === region;
    const isSel = !selectableRegions || selectableRegions.indexOf(region) !== -1;
    const fill = REGION_FILL_COLORS[region] || "#888";
    // Tamamlanan bölgeler: kalemle çizilmiş gibi koyu, kalın çerçeve (yeşil ✓ yerine)
    if (status === "done") {
      return {
        fillColor: fill,
        weight: isHL ? 1.1 : 0.9,
        color: "rgba(40,30,25,0.55)",
        opacity: isHL ? 0.75 : 0.6,
        fillOpacity: isHL ? 0.7 : 0.6,
      };
    }
    // Kilitli bölgeler de kendi pastel renklerini korur, sadece daha soluk + kilit ikonu durumu gösterir
    if (status === "locked") {
      return {
        fillColor: fill,
        weight: isHL ? 0.8 : 0.3,
        color: isHL ? "rgba(40,30,25,0.4)" : "rgba(255,255,255,0.35)",
        fillOpacity: isHL ? 0.55 : 0.42,
      };
    }
    // Mission mode'unda seçilemeyen bölgeler: gri
    if (!isSel) {
      return { fillColor: "#cfcfcf", weight: 0.3, color: "#888", fillOpacity: 0.35 };
    }
    return {
      fillColor: fill,
      weight: isHL ? 0.9 : 0.3,
      color: isHL ? "rgba(40,30,25,0.5)" : "rgba(255,255,255,0.35)",
      fillOpacity: isHL ? 0.75 : 0.6,
    };
  };

  const refreshTopicMarkers = () => {
    if (!mapRef.current || !window.L) return;
    // Clean previous
    if (topicClusterRef.current) {
      try { mapRef.current.removeLayer(topicClusterRef.current); } catch(e){}
      topicClusterRef.current = null;
    }
    topicMarkersRef.current = [];

    let regionsProgress = {};
    try { const raw = localStorage.getItem('tk_state'); if (raw) regionsProgress = (JSON.parse(raw).regionsProgress) || {}; } catch(e) {}

    // Cluster group with custom badge + click handler
    const cluster = window.L.markerClusterGroup({
      maxClusterRadius: 18,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: false,
      spiderfyOnMaxZoom: false,
      animate: true,
      iconCreateFunction: (c) => {
        const count = c.getChildCount();
        // Pick the dominant region color among children
        let regionColor = "var(--accent)";
        const children = c.getAllChildMarkers();
        if (children.length && children[0].options && children[0].options._tkRegion) {
          regionColor = REGION_FILL_COLORS[children[0].options._tkRegion] || "var(--accent)";
        }
        const html = '<div class="tk-cluster-badge" style="background:' + regionColor + '">' + count + '</div>';
        return window.L.divIcon({ html, className: 'tk-cluster-divicon', iconSize: [24, 24], iconAnchor: [12, 12] });
      },
    });

    cluster.on('clusterclick', (e) => {
      const childMarkers = e.layer.getAllChildMarkers();
      const items = childMarkers.map(m => m.options && m.options._tkData).filter(Boolean);
      if (!items.length) return;
      const header = '<div style="font-family:var(--font-display);font-size:18px;color:var(--title);margin-bottom:10px;text-align:center;border-bottom:1.5px dashed var(--rule);padding-bottom:8px">📍 Bu yakınlıkta ' + items.length + ' yer</div>';
      const list = items.map(it => {
        const regColor = REGION_FILL_COLORS[it.region] || "var(--accent)";
        return '<div style="display:flex;gap:10px;padding:9px 10px;background:var(--bg-paper);border-radius:8px;margin-bottom:5px;border-left:3px solid ' + regColor + '">' +
          '<div style="font-size:24px;flex-shrink:0;line-height:1.2">' + it.emoji + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div style="font-family:var(--font-hand);font-weight:700;font-size:14px;color:var(--title);line-height:1.15;margin-bottom:1px">' + it.label + '</div>' +
            '<div style="font-size:9px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px">📍 ' + it.city + '</div>' +
            '<div style="font-size:11px;line-height:1.35;color:var(--ink-soft)">' + it.desc + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      const html = '<div style="min-width:250px;max-width:300px;max-height:320px;overflow-y:auto">' + header + list + '</div>';
      window.L.popup({ className: 'tk-region-popup', maxWidth: 320, autoPan: true })
        .setLatLng(e.layer.getLatLng())
        .setContent(html)
        .openOn(e.target._map);
    });

    Object.entries(REGION_TOPIC_ICONS).forEach(([region, _legacy]) => {
      const icons = (window.getTopicIconsForRegion ? window.getTopicIconsForRegion(region) : _legacy) || [];
      const data = regionsProgress[region] || {};
      const correctCount = ((data.missions || []).filter(m => m && m.correct)).length;
      const total = icons.length;
      const visible = correctCount === 0 ? 0 :
                      correctCount >= 3 ? total :
                      Math.max(1, Math.ceil(total * correctCount / 3));
      const fillColor = REGION_FILL_COLORS[region] || "#888";
      for (let i = 0; i < visible; i++) {
        const ic = icons[i];
        const html = '<div class="tk-region-dot"><div class="tk-dot-circle" style="width:13px;height:13px;border-radius:50%;background:' + fillColor + ';border:2.5px solid #FAF6EC;box-shadow:0 1px 3px rgba(0,0,0,.45)"></div></div>';
        const lIcon = window.L.divIcon({ html, className: '', iconSize: [18, 18], iconAnchor: [9, 9] });
        const marker = window.L.marker([ic.lat, ic.lng], {
          icon: lIcon, interactive: true, riseOnHover: true,
          _tkData: { ...ic, region }, _tkRegion: region,
        });
        const popupHtml = '<div style="text-align:center;min-width:160px;max-width:220px">' +
          '<div style="font-size:42px;line-height:1;margin-bottom:6px">' + ic.emoji + '</div>' +
          '<div style="font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--title);line-height:1.1;margin-bottom:2px">' + ic.label + '</div>' +
          '<div style="font-family:var(--font-label);font-size:11px;color:var(--ink-mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">📍 ' + ic.city + '</div>' +
          '<div style="font-size:13px;line-height:1.45;color:var(--ink-soft)">' + ic.desc + '</div>' +
          '</div>';
        marker.bindPopup(popupHtml, { className: 'tk-region-popup', maxWidth: 240, closeButton: true });
        marker.bindTooltip(ic.label, { permanent: false, direction: 'top', offset: [0, -8] });
        cluster.addLayer(marker);
        topicMarkersRef.current.push(marker);
      }
    });

    cluster.addTo(mapRef.current);
    topicClusterRef.current = cluster;
  };

  const refreshStatusMarkers = () => {
    if (!mapRef.current || !window.L) return;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    Object.entries(REGION_CENTERS).forEach(([region, center]) => {
      const status = progress[region] || "open";
      let html = null;
      if (status === "locked") {
        html = '<div style="background:#FAF6EC;color:#3E2723;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2.5px solid #3E2723;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,0.4)">🔒</div>';
      }
      if (!html) return;
      const icon = window.L.divIcon({ html, className: "", iconSize: [40, 40], iconAnchor: [20, 20] });
      const marker = window.L.marker(center, { icon, interactive: false, keyboard: false }).addTo(mapRef.current);
      markersRef.current.push(marker);
    });
  };

  useEffectLib(() => {
    if (mapRef.current || !containerRef.current) return;
    if (!window.L || !window.TURKEY_GEO) {
      console.warn("Leaflet veya TURKEY_GEO yüklenmedi");
      return;
    }

    const map = window.L.map(containerRef.current, {
      zoomControl: !decorative,
      dragging: !decorative,
      scrollWheelZoom: false,
      doubleClickZoom: !decorative,
      touchZoom: !decorative,
      boxZoom: !decorative,
      keyboard: !decorative,
      attributionControl: false,
      zoomSnap: 0.25,
    });

    window.L.tileLayer("https://cartodb-basemaps-{s}.global.ssl.fastly.net/light_all/{z}/{x}/{y}.png", {
      maxZoom: 18, subdomains: "abcd",
    }).addTo(map);

    const layer = window.L.geoJSON(window.TURKEY_GEO, {
      style: computeStyle,
      onEachFeature: (feature, lyr) => {
        const region = feature.properties.region;
        const provName = feature.properties.name;
        lyr.bindTooltip(`${provName} · ${REGION_DISPLAY_NAMES[region] || region}`, {
          sticky: true, direction: "top", offset: [0, -8], className: "tk-tooltip",
        });
        // Mobile hover için path → { region, layer } mapping
        setTimeout(() => {
          if (lyr._path) pathToRegionRef.current.set(lyr._path, { region, layer: lyr });
        }, 0);
        lyr.on("click", () => {
          const p = propsRef.current;
          if (!p.onRegionClick) return;
          const status = (p.progress || {})[region] || "open";
          const isSel = !p.selectableRegions || p.selectableRegions.indexOf(region) !== -1;
          if (status === "locked" || !isSel) return;
          // Mobil için: hovered state'i temizle ki polygon highlight'ı kalmasın
          setHovered(null);
          // Leaflet path'in focus'unu kaldır (mobil tap highlight için)
          try { if (lyr._path && typeof lyr._path.blur === 'function') lyr._path.blur(); } catch(e) {}
          p.onRegionClick(region);
        });
        lyr.on("mouseover", () => {
          if (!propsRef.current.hoverable) return;
          setHovered(region);
        });
        lyr.on("mouseout", () => setHovered(null));
      },
    }).addTo(map);

    layerRef.current = layer;
    mapRef.current = map;

    // Mobile hover desteği: touch/pen ile sürüklerken bölge sınırını + il tooltip'ini desktop ile eşitle
    const containerEl = map.getContainer();
    let activeTooltipLayer = null;
    const closeActiveTooltip = () => {
      if (activeTooltipLayer && typeof activeTooltipLayer.closeTooltip === 'function') {
        try { activeTooltipLayer.closeTooltip(); } catch(e) {}
      }
      activeTooltipLayer = null;
    };
    const onPointerMove = (e) => {
      // Sadece touch/pen — mouse zaten Leaflet'in mouseover'ı ile çalışıyor
      if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      const els = document.elementsFromPoint(e.clientX, e.clientY);
      let foundRegion = null;
      let foundLayer = null;
      for (const el of els) {
        if (el && el.tagName === 'path' && el.classList && el.classList.contains('leaflet-interactive')) {
          const entry = pathToRegionRef.current.get(el);
          if (entry) { foundRegion = entry.region; foundLayer = entry.layer; break; }
        }
      }
      if (foundRegion !== hovered) setHovered(foundRegion);
      // Tooltip parity (desktop bindTooltip 'Manisa · Ege' gibi gösterir)
      if (foundLayer && foundLayer !== activeTooltipLayer) {
        closeActiveTooltip();
        try {
          const rect = containerEl.getBoundingClientRect();
          const cp = window.L.point(e.clientX - rect.left, e.clientY - rect.top);
          const latlng = map.containerPointToLatLng(cp);
          foundLayer.openTooltip(latlng);
          activeTooltipLayer = foundLayer;
        } catch(err) {}
      } else if (!foundLayer) {
        closeActiveTooltip();
      }
      // Otomatik temizleme timer'ı sıfırla
      if (touchHoverTimerRef.current) {
        clearTimeout(touchHoverTimerRef.current);
        touchHoverTimerRef.current = null;
      }
    };
    const onPointerEnd = (e) => {
      if (e.pointerType !== 'touch' && e.pointerType !== 'pen') return;
      // Touch bitince kısa süre sonra hover + tooltip temizle
      if (touchHoverTimerRef.current) clearTimeout(touchHoverTimerRef.current);
      touchHoverTimerRef.current = setTimeout(() => {
        setHovered(null);
        closeActiveTooltip();
        touchHoverTimerRef.current = null;
      }, 1200);
    };
    containerEl.addEventListener('pointermove', onPointerMove, { passive: true });
    containerEl.addEventListener('pointerup', onPointerEnd, { passive: true });
    containerEl.addEventListener('pointercancel', onPointerEnd, { passive: true });
    // Cleanup'a ekle: cleanup'ı return içinde yapacağız
    map.fitBounds(layer.getBounds(), { paddingTopLeft: [4, 50], paddingBottomRight: [4, 4] });
    map.setZoom(map.getZoom() + 0.1, { animate: false });
    refreshStatusMarkers();
    refreshTopicMarkers();
    setTimeout(() => map.invalidateSize(), 100);

    return () => {
      try {
        containerEl.removeEventListener('pointermove', onPointerMove);
        containerEl.removeEventListener('pointerup', onPointerEnd);
        containerEl.removeEventListener('pointercancel', onPointerEnd);
      } catch (e) {}
      if (touchHoverTimerRef.current) clearTimeout(touchHoverTimerRef.current);
      pathToRegionRef.current.clear();
      map.remove();
      mapRef.current = null;
      layerRef.current = null;
      markersRef.current = [];
      topicMarkersRef.current = [];
    };
  }, []);

  useEffectLib(() => {
    if (layerRef.current) layerRef.current.setStyle(computeStyle);
    refreshStatusMarkers();
    refreshTopicMarkers();
  });

  let cursorStyle = "default";
  if (hovered && onRegionClick) {
    const status = progress[hovered] || "open";
    const isSel = !selectableRegions || selectableRegions.indexOf(hovered) !== -1;
    cursorStyle = (status === "locked" || !isSel) ? "not-allowed" : "pointer";
  }
  const hoveredColor = hovered ? REGION_FILL_COLORS[hovered] : null;
  const hoveredName = hovered ? (REGION_DISPLAY_NAMES[hovered] || hovered) : null;
  const hoveredStatus = hovered ? (progress[hovered] || "open") : null;
  const hoveredSuffix = hoveredStatus === "locked" ? "  🔒" : (hoveredStatus === "done" ? "  ✓" : "");

  return (
    <div style={{
      position: "relative", width: "100%", height,
      borderRadius: 12, overflow: "hidden",
      border: "1.5px solid var(--rule)",
      boxShadow: "0 6px 14px rgba(62,39,35,.12)",
      background: "#E8EEF3",
    }}>
      <div ref={containerRef} style={{ width: "100%", height: "100%", cursor: cursorStyle }}/>
      {hovered && hoverable && (
        <div style={{
          position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)", zIndex: 1000,
          background: "#FAF6EC", color: hoveredColor,
          padding: "6px 18px", borderRadius: 999,
          fontFamily: "Patrick Hand, cursive", fontWeight: 700, fontSize: 18,
          border: `2px solid ${hoveredColor}`,
          boxShadow: "0 2px 8px rgba(0,0,0,0.2)",
          pointerEvents: "none",
        }}>
          {hoveredName}{hoveredSuffix}
        </div>
      )}
    </div>
  );
};

const Confetti = ({ count = 30 }) => {
  const colors = ["#C62828", "#558B2F", "#F9A825", "#1976D2", "#FFA726", "#7CB342", "#B8862F"];
  return (
    <svg viewBox="0 0 800 600" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", pointerEvents: "none" }}>
      {Array.from({ length: count }).map((_, i) => {
        const x = (i * 53) % 800;
        const y = (i * 37) % 380 + 20;
        const c = colors[i % colors.length];
        const r = (i * 23) % 360;
        const w = 8 + (i % 4) * 2;
        const h = 4 + (i % 3) * 2;
        return <rect key={i} x={x} y={y} width={w} height={h} rx="1.5"
                     fill={c} transform={`rotate(${r} ${x + w/2} ${y + h/2})`} opacity=".9"/>;
      })}
    </svg>
  );
};

const TimerBar = ({ seconds = 15, onExpire, paused = false }) => {
  const [remaining, setRemaining] = useStateLib(seconds);

  useEffectLib(() => {
    setRemaining(seconds);
  }, [seconds]);

  useEffectLib(() => {
    if (paused) return;
    if (remaining <= 0) {
      if (typeof onExpire === 'function') onExpire();
      return;
    }
    const t = setTimeout(() => {
      setRemaining(r => Math.max(0, +(r - 0.1).toFixed(2)));
    }, 100);
    return () => clearTimeout(t);
  }, [remaining, paused]);

  const pct = Math.max(0, Math.min(100, (remaining / seconds) * 100));
  const half = seconds / 2;
  const quarter = seconds / 4;
  const labelColor = remaining <= quarter ? "var(--accent)" : (remaining <= half ? "#B8862F" : "var(--success)");
  const fillBg = remaining <= quarter
    ? "linear-gradient(90deg, #C62828 0%, #E53935 100%)"
    : (remaining <= half
        ? "linear-gradient(90deg, #F9A825 0%, #FFB300 100%)"
        : "linear-gradient(90deg, #558B2F 0%, #7CB342 100%)");

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
        <span className="t-label" style={{ fontSize: 11 }}>Kalan süre</span>
        <span style={{ fontFamily: "var(--font-hand)", fontSize: 18, color: labelColor, fontWeight: 700 }}>
          ⏱ {Math.ceil(remaining).toString().padStart(2, "0")} sn
        </span>
      </div>
      <div style={{
        height: 14, borderRadius: 999, background: "#E1D2AA", overflow: "hidden",
        border: "1.5px solid var(--rule)",
      }}>
        <div style={{
          width: `${pct}%`, height: "100%",
          background: fillBg,
          transition: "width 100ms linear, background 200ms ease",
        }}/>
      </div>
    </div>
  );
};

/* ========== Çantam (BackpackModal) — Performans Dashboard ========== */
const BackpackModal = ({ progress, onClose }) => {
  if (!progress) return null;
  const REGIONS = window.REGIONS || [];
  const state = progress.state || {};
  const rp = state.regionsProgress || {};
  const playerName = state.playerName || "Maceracı";

  const startedAt = state.startedAt ? new Date(state.startedAt) : null;
  const elapsedMs = startedAt ? Date.now() - startedAt.getTime() : 0;
  const elapsedMin = Math.max(1, Math.round(elapsedMs / 60000));

  // Stats
  let totalAttempts = 0, totalCorrect = 0, totalMissionsCompleted = 0, totalMissionTimeMs = 0;
  Object.values(rp).forEach(r => {
    (r.missions || []).forEach(m => {
      if (!m) return;
      totalAttempts += (m.attempts || 0);
      if (m.correct) { totalCorrect += 1; totalMissionsCompleted += 1; }
      totalMissionTimeMs += (m.timeMs || 0);
    });
  });
  const accuracy = totalAttempts > 0 ? Math.round(totalCorrect / totalAttempts * 100) : 0;
  const earned = (typeof progress.earnedBadgeCount === "function") ? progress.earnedBadgeCount() : 0;

  // Region color palette
  const COLOR = {
    marmara: "#64B5F6", karadeniz: "#81C784", ege: "#AED581",
    icanadolu: "#FFE082", akdeniz: "#FFB74D",
    doguanadolu: "#B39DDB", guneydogu: "#EF9A9A",
  };

  const formatDate = (d) => {
    if (!d) return "—";
    return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  };

  const StatCard = ({ icon, value, label, color }) => (
    <div style={{
      background: "var(--bg-paper)", borderRadius: 12, padding: "14px 8px",
      border: "1.5px solid var(--rule-soft)", textAlign: "center",
      display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center",
      minWidth: 0, minHeight: 96,
    }}>
      <div style={{ fontSize: 22, lineHeight: 1 }}>{icon}</div>
      <div style={{
        fontFamily: "var(--font-display)", fontSize: 26, fontWeight: 700,
        color: color || "var(--title)", lineHeight: 1, marginTop: 6,
        whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis", maxWidth: "100%",
      }}>{value}</div>
      <div className="t-label" style={{ fontSize: 10, marginTop: 4 }}>{label}</div>
    </div>
  );

  const RegionRow = ({ region }) => {
    const status = (typeof progress.getRegionStatus === "function")
      ? progress.getRegionStatus(region.id) : "locked";
    const data = rp[region.id] || {};
    const missions = Array.isArray(data.missions) ? data.missions : [];
    const completedCount = missions.filter(m => m && m.correct).length;
    const attemptsTotal = missions.reduce((s, m) => s + (m && m.attempts || 0), 0);
    const timeMin = Math.round(missions.reduce((s, m) => s + (m && m.timeMs || 0), 0) / 60000);

    let detail = null;
    let statusBadge = null;
    if (status === "done") {
      statusBadge = <span style={{ color: "var(--success)", fontWeight: 700 }}>✓ Tamamlandı</span>;
      detail = `${completedCount}/3 görev · ${attemptsTotal} deneme${timeMin > 0 ? ` · ${timeMin} dk` : ""}`;
    } else if (status === "open") {
      if (completedCount > 0) {
        statusBadge = <span style={{ color: "var(--accent)", fontWeight: 700 }}>● Devam ediyor</span>;
        detail = `${completedCount}/3 görev tamamlandı`;
      } else {
        statusBadge = <span style={{ color: "var(--ink-soft)", fontWeight: 700 }}>○ Açık · henüz başlamadın</span>;
        detail = "Tıkla, keşfetmeye başla";
      }
    } else {
      statusBadge = <span style={{ color: "var(--ink-mute)", fontWeight: 700 }}>🔒 Kilitli</span>;
      detail = "Önce diğer bölgeleri tamamla";
    }

    return (
      <div style={{
        display: "flex", alignItems: "center", gap: 14,
        padding: "12px 14px",
        background: "var(--bg-paper)",
        borderRadius: 10, marginBottom: 8,
        borderLeft: "5px solid " + (COLOR[region.id] || "#ccc"),
        boxShadow: "0 1px 2px rgba(62,39,35,.05)",
      }}>
        <div style={{ fontSize: 26 }}>{region.badge}</div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{
            fontFamily: "var(--font-hand)", fontSize: 20, fontWeight: 700, color: "var(--ink)",
          }}>{region.name}</div>
          <div style={{ fontSize: 12, color: "var(--ink-soft)", marginTop: 2 }}>{detail}</div>
        </div>
        <div style={{ fontSize: 12, fontFamily: "var(--font-label)", textTransform: "uppercase", letterSpacing: ".06em" }}>
          {statusBadge}
        </div>
      </div>
    );
  };

  return (
    <div onClick={onClose} style={{
      position: "fixed", inset: 0, zIndex: 9990,
      background: "rgba(62,39,35,.55)",
      display: "flex", alignItems: "center", justifyContent: "center",
      padding: 24,
    }}>
      <div onClick={(e) => e.stopPropagation()} className="paper-cream" style={{
        width: "100%", maxWidth: 700, maxHeight: "90vh",
        borderRadius: 18, padding: 0, overflow: "hidden",
        border: "1.5px solid var(--rule)",
        boxShadow: "0 16px 48px rgba(0,0,0,.45)",
        display: "flex", flexDirection: "column",
      }}>
        {/* Header */}
        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          padding: "18px 24px", borderBottom: "1.5px dashed var(--rule)",
          background: "linear-gradient(180deg, #FAF6EC 0%, #F1E9D2 100%)",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontSize: 26 }}>🎒</span>
            <div>
              <div className="t-label" data-tk="chantam-label" style={{ fontSize: 11 }}>Çantam</div>
              <div style={{
                fontFamily: "var(--font-display)", fontSize: 28, color: "var(--title)", lineHeight: 1,
              }}>Performansım</div>
            </div>
          </div>
          <button onClick={onClose} style={{
            width: 36, height: 36, borderRadius: "50%",
            background: "var(--bg-cream)", border: "1.5px solid var(--ink-mute)",
            cursor: "pointer", fontSize: 16, color: "var(--ink)",
          }} aria-label="Kapat">✕</button>
        </div>

        {/* Body */}
        <div style={{ padding: "20px 24px", overflowY: "auto" }}>
          {/* Player */}
          <div style={{
            display: "flex", alignItems: "center", gap: 16,
            padding: "14px 16px",
            background: "var(--bg-paper)",
            borderRadius: 12, border: "1.5px solid var(--rule-soft)",
            marginBottom: 18,
          }}>
            <div style={{
              width: 56, height: 56, borderRadius: "50%",
              background: "var(--gold-soft)", border: "2px solid var(--gold)",
              display: "grid", placeItems: "center", fontSize: 28,
            }}>👤</div>
            <div style={{ flex: 1 }}>
              <div className="t-label" style={{ fontSize: 11 }}>Maceracı</div>
              <div style={{
                fontFamily: "var(--font-hand)", fontSize: 26, fontWeight: 700, color: "var(--title)", lineHeight: 1.1,
              }}>{playerName}</div>
              <div style={{ fontSize: 13, color: "var(--ink-soft)", marginTop: 2 }}>
                Başlangıç: {formatDate(startedAt)} · Süre: {elapsedMin} dk
              </div>
            </div>
          </div>

          {/* Stats grid */}
          <div className="t-label" style={{ fontSize: 11, marginBottom: 8 }}>Genel Durum</div>
          <div data-tk="backpack-stats" style={{
            display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 10, marginBottom: 22,
          }}>
            <StatCard icon="🏆" value={`${earned}/7`} label="Rozet" color="var(--accent)"/>
            <StatCard icon="📋" value={`${totalMissionsCompleted}/21`} label="Görev"/>
            <StatCard icon="⚡" value={`${accuracy}%`} label="Doğruluk" color="var(--success)"/>
            <StatCard icon="📝"
              value={state.quizScore !== null && state.quizScore !== undefined ? `${state.quizScore}/15` : "—"}
              label="Quiz"/>
          </div>

          {/* Per-region progress */}
          <div className="t-label" style={{ fontSize: 11, marginBottom: 8 }}>Bölge Bölge İlerleme</div>
          <div>
            {REGIONS.map(r => <RegionRow key={r.id} region={r}/>)}
          </div>

          {/* Kazanımlar (MEB Sosyal Bilgiler) */}
          {(() => {
            const KAZ = window.KAZANIMLAR || {};
            const grade = (state.grade && KAZ[state.grade]) ? state.grade : 5;
            const list = KAZ[grade] || [];
            if (!list.length) return null;
            const isKazDone = (k) => {
              if (k.region === "all") return earned >= 5;
              const rs = (state.regionsProgress || {})[k.region];
              return rs && rs.status === "done";
            };
            const tamamlananlar = list.filter(isKazDone);
            const tamamlanacaklar = list.filter(k => !isKazDone(k));

            const KazRow = ({ k, done }) => (
              <div style={{
                display: "flex", alignItems: "flex-start", gap: 10,
                padding: "8px 12px",
                background: done ? "rgba(85,139,47,.08)" : "var(--bg-paper)",
                borderRadius: 8, marginBottom: 6,
                borderLeft: "3px solid " + (done ? "var(--success)" : "var(--rule)"),
              }}>
                <div style={{
                  fontSize: 16, lineHeight: 1.4, marginTop: 1,
                  color: done ? "var(--success)" : "var(--ink-mute)",
                }}>{done ? "✓" : "○"}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{
                    fontFamily: "var(--font-label)", fontSize: 10,
                    color: done ? "var(--success)" : "var(--ink-mute)", fontWeight: 700,
                    textTransform: "uppercase", letterSpacing: ".06em", marginBottom: 1,
                  }}>{k.code}</div>
                  <div style={{
                    fontSize: 13, lineHeight: 1.4,
                    color: done ? "var(--ink)" : "var(--ink-soft)",
                    textDecoration: done ? "none" : "none",
                  }}>{k.text}</div>
                </div>
              </div>
            );

            return (
              <div style={{ marginTop: 22 }}>
                <div className="t-label" style={{ fontSize: 11, marginBottom: 8 }}>
                  📚 Kazanımlarım — {grade}. Sınıf · {tamamlananlar.length}/{list.length}
                </div>
                {tamamlananlar.length > 0 && (
                  <div style={{ marginBottom: 10 }}>
                    <div style={{
                      fontFamily: "var(--font-hand)", fontSize: 14, color: "var(--success)",
                      fontWeight: 700, marginBottom: 6,
                    }}>
                      ✓ Tamamlananlar ({tamamlananlar.length})
                    </div>
                    {tamamlananlar.map(k => <KazRow key={k.code} k={k} done={true}/>)}
                  </div>
                )}
                {tamamlanacaklar.length > 0 && (
                  <div>
                    <div style={{
                      fontFamily: "var(--font-hand)", fontSize: 14, color: "var(--ink-soft)",
                      fontWeight: 700, marginBottom: 6,
                    }}>
                      ○ Tamamlanacaklar ({tamamlanacaklar.length})
                    </div>
                    {tamamlanacaklar.map(k => <KazRow key={k.code} k={k} done={false}/>)}
                  </div>
                )}
              </div>
            );
          })()}

          {/* Encouragement footer */}
          <div style={{
            marginTop: 20, padding: "14px 16px",
            background: "var(--gold-soft)",
            borderRadius: 10, border: "1.5px dashed var(--gold)",
            fontFamily: "var(--font-hand)", fontSize: 16, color: "var(--ink)", textAlign: "center",
          }}>
            {earned === 7
              ? "🎉 Tüm rozetleri topladın! Final aşamasındasın, harika gidiyorsun!"
              : earned >= 4
                ? `🌟 ${earned} rozet kazandın! Sona az kaldı, hadi devam!`
                : earned >= 1
                  ? `💪 ${earned} rozet senin oldu! Bir sonrakine geç.`
                  : "🚀 Macera daha yeni başlıyor, ilk bölgeyi seç ve keşfet!"}
          </div>
        </div>
      </div>
    </div>
  );
};

          const data = regionsProgress[r.id] || {};
          const correctCount = ((data.missions || []).filter(m => m && m.correct)).length;
          const isDone = status === "done";

          const fillColor = REGION_FILL_COLORS[r.id] || "#888";

                )}

              {next && (
                <div style={{

                }}/>

/* ========== JourneyMap — Tek bölge için yatay 5 kategori (haritanın altında) ========== */
const JourneyMap = ({ regionId, regionsProgress = {}, onCategorySelect }) => {
  const REGIONS = window.REGIONS || [];
  const CATS_BY_REG = null; /* replaced by getCategoriesForRegion */
  const region = REGIONS.find(r => r.id === regionId) || REGIONS[0];
  if (!region) return null;
  const cats = (window.getCategoriesForRegion ? window.getCategoriesForRegion(region.id) : (window.CATEGORIES_BY_REGION && window.CATEGORIES_BY_REGION[region.id]) || []);
  const data = regionsProgress[region.id] || {};
  const catProgress = data.categories || {};
  const fillColor = (window.REGION_FILL_COLORS || {})[region.id] || "#888";
  const doneCount = cats.filter(c => (catProgress[c.id] && catProgress[c.id].completed)).length;
  const totalCorrect = cats.reduce((s, c) => {
    const cp = catProgress[c.id] || {};
    return s + (typeof cp.correctCount === "number" ? cp.correctCount : 0);
  }, 0);
  const overallPct = cats.length ? Math.round((totalCorrect / (cats.length * 3)) * 100) : 0;

  return (
    <div data-tk="journey-map" style={{
      flexShrink: 0,
      padding: "8px 24px 12px",
      background: "linear-gradient(180deg, transparent, rgba(241,233,210,.95) 30%)",
    }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6, gap: 12 }}>
        <div className="t-label" style={{ fontSize: 11 }}>
          🛤️ Yolculuk Haritam · {region.name} · {doneCount}/{cats.length} kategori · {overallPct}%
        </div>
        <div style={{ fontSize: 11, color: "var(--ink-mute)", fontFamily: "var(--font-hand)" }}>
          Bir kategori seçerek o sorulara odaklan →
        </div>
      </div>
      <div data-tk="journey-map-grid" style={{
        display: "grid",
        gridTemplateColumns: "repeat(" + cats.length + ", minmax(0, 1fr))",
        gap: 8,
      }}>
        {cats.map((c, i) => {
          const cp = catProgress[c.id] || {};
          const correct = (typeof cp.correctCount === "number") ? cp.correctCount : ((cp.missions || []).filter(m => m && m.correct).length);
          const pct = Math.min(100, Math.round((correct / 3) * 100));
          const isDone = !!cp.completed;
          return (
            <button
              key={c.id}
              onClick={() => !isDone && onCategorySelect && onCategorySelect(region.id, c.id)}
              disabled={isDone}
              title={c.label + " · " + pct + "%"}
              style={{
                display: "flex", flexDirection: "column", alignItems: "stretch", gap: 4,
                padding: "10px 10px",
                background: isDone ? "var(--bg-paper)" : "var(--bg-cream)",
                border: "2px solid " + (isDone ? "var(--success)" : (correct > 0 ? fillColor : "var(--rule-soft)")),
                borderRadius: 10,
                cursor: isDone ? "default" : "pointer",
                textAlign: "left",
                fontFamily: "var(--font-body)",
                opacity: isDone ? 0.85 : 1,
                transition: "all .15s",
                position: "relative",
              }}
              onMouseEnter={(e) => { if (!isDone) e.currentTarget.style.transform = "translateY(-1px)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.transform = "translateY(0)"; }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 22, flexShrink: 0 }}>{c.emoji}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{
                    fontFamily: "var(--font-hand)", fontWeight: 700, fontSize: 13, color: "var(--ink)",
                    lineHeight: 1.1, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                  }}>{c.label}</div>
                  <div style={{
                    fontSize: 11, color: isDone ? "var(--success)" : "var(--ink-mute)", fontWeight: 700,
                  }}>
                    {isDone ? "✓ Tamamlandı" : (correct + "/3 · " + pct + "%")}
                  </div>
                </div>
              </div>
              <div style={{
                height: 5, borderRadius: 3,
                background: "var(--rule-soft)", overflow: "hidden",
              }}>
                <div style={{
                  width: pct + "%", height: "100%",
                  background: isDone ? "var(--success)" : fillColor,
                  transition: "width .35s ease-out",
                }}/>
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
};
Object.assign(window, { JourneyMap });

/* ====== Grade-aware mission/quiz selection (random pool sampling) ====== */
const _gameOrder = { regions: {}, quiz: null };
const _shuffleArr = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const _readGradeFromStorage = () => {
  try {
    const raw = localStorage.getItem('tk_state');
    if (raw) {
      const s = JSON.parse(raw);
      const g = parseInt(s.grade, 10);
      if (g >= 5 && g <= 8) return g;
    }
  } catch(e) {}
  return 5;
};
const getMissionsForGame = (regionId) => {
  if (_gameOrder.regions[regionId]) return _gameOrder.regions[regionId];
  const grade = _readGradeFromStorage();
  const graded = window.REGIONS_CONTENT_GRADED && window.REGIONS_CONTENT_GRADED[regionId];
  let pool = null;
  if (graded && graded.missionsByGrade && graded.missionsByGrade[grade] && graded.missionsByGrade[grade].length) {
    pool = graded.missionsByGrade[grade];
  } else if (window.REGIONS_CONTENT && window.REGIONS_CONTENT[regionId] && window.REGIONS_CONTENT[regionId].missions) {
    pool = window.REGIONS_CONTENT[regionId].missions;
  }
  if (!pool || !pool.length) return [];
  // Tag each mission with its original index so we can later derive its category.
  const indexed = pool.map((m, i) => ({ ...m, _origIdx: i }));
  const selected = _shuffleArr(indexed).slice(0, 3);
  _gameOrder.regions[regionId] = selected;
  return selected;
};
const getQuizForGame = () => {
  if (_gameOrder.quiz) return _gameOrder.quiz;
  const grade = _readGradeFromStorage();
  let pool = null;
  if (window.FINAL_QUIZ_BY_GRADE && window.FINAL_QUIZ_BY_GRADE[grade] && window.FINAL_QUIZ_BY_GRADE[grade].length) {
    pool = window.FINAL_QUIZ_BY_GRADE[grade];
  } else if (window.FINAL_QUIZ) {
    pool = window.FINAL_QUIZ;
  }
  if (!pool || !pool.length) return [];
  const selected = _shuffleArr(pool).slice(0, 15);
  _gameOrder.quiz = selected;
  return selected;
};
const resetGameOrder = () => { _gameOrder.regions = {}; _gameOrder.quiz = null; };
const resetRegionGameOrder = (regionId) => {
  if (regionId && _gameOrder.regions) { delete _gameOrder.regions[regionId]; }
};
Object.assign(window, { getMissionsForGame, getQuizForGame, resetGameOrder, resetRegionGameOrder });

  <script type="text/babel" data-presets="react">
const STORAGE_KEY = 'tk_state';

const INITIAL_STATE = {
  playerName: '',
  grade: 5,
  startedAt: null,
  regionsProgress: {},
  quizScore: null,
  sessionLog: [],
};

const STARTING_OPEN_REGIONS = [
  'marmara', 'karadeniz', 'ege', 'icanadolu',
  'akdeniz', 'doguanadolu', 'guneydogu',
];

/* Tüm 7 bölge başlangıçtan itibaren açıktır — kilitli bölge yoktur. */
const computeUnlocked = (_doneCount) => {
  return new Set(STARTING_OPEN_REGIONS);
};

const loadFromStorage = () => {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { ...INITIAL_STATE };
    const parsed = JSON.parse(raw);
    return { ...INITIAL_STATE, ...parsed };
  } catch (e) {
    console.warn('tk_state parse hatası:', e);
    return { ...INITIAL_STATE };
  }
};

const saveToStorage = (state) => {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.warn('tk_state kaydedilemedi:', e);
  }
};

const useProgress = () => {
  const [state, setState] = React.useState(() => loadFromStorage());

  React.useEffect(() => {
    saveToStorage(state);
  }, [state]);

  const setPlayerName = (name) => {
    setState(prev => ({
      ...prev,
      playerName: name,
      startedAt: prev.startedAt || new Date().toISOString(),
    }));
  };

  const setGrade = (g) => {
    const grade = Math.max(5, Math.min(8, parseInt(g, 10) || 5));
    setState(prev => ({ ...prev, grade }));
    // Grade change invalidates cached random question selections (different pool).
    if (typeof window !== 'undefined' && typeof window.resetGameOrder === 'function') {
      window.resetGameOrder();
    }
  };

  const earnedBadgeCount = () => {
    return Object.values(state.regionsProgress || {})
      .filter(r => r && r.status === 'done').length;
  };

  const isRegionDone = (regionId) => {
    const r = state.regionsProgress && state.regionsProgress[regionId];
    return !!(r && r.status === 'done');
  };

  const isRegionUnlocked = (regionId) => {
    const unlocked = computeUnlocked(earnedBadgeCount());
    return unlocked.has(regionId);
  };

  const getRegionStatus = (regionId) => {
    if (isRegionDone(regionId)) return 'done';
    if (isRegionUnlocked(regionId)) return 'open';
    return 'locked';
  };

  const getProgressMap = () => {
    const allIds = ['marmara', 'karadeniz', 'ege', 'icanadolu', 'akdeniz', 'doguanadolu', 'guneydogu'];
    const map = {};
    allIds.forEach(id => { map[id] = getRegionStatus(id); });
    return map;
  };

  const completeRegion = (regionId) => {
    setState(prev => {
      const existing = (prev.regionsProgress && prev.regionsProgress[regionId]) || { missions: [] };
      if (existing.status === 'done') return prev;
      return {
        ...prev,
        regionsProgress: {
          ...prev.regionsProgress,
          [regionId]: {
            ...existing,
            status: 'done',
            completedAt: new Date().toISOString(),
          }
        },
        sessionLog: [
          ...(prev.sessionLog || []),
          { ts: Date.now(), type: 'region_complete', payload: { regionId } }
        ]
      };
    });
  };

  const recordMissionAttempt = (regionId, missionIdx, correct, timeMs) => {
    setState(prev => {
      const existing = (prev.regionsProgress && prev.regionsProgress[regionId]) || { missions: [] };
      const missions = Array.isArray(existing.missions) ? [...existing.missions] : [];
      const cur = missions[missionIdx] || { attempts: 0, correct: false, timeMs: 0 };
      missions[missionIdx] = {
        attempts: (cur.attempts || 0) + 1,
        correct: !!correct || !!cur.correct,
        timeMs: (cur.timeMs || 0) + (timeMs || 0),
      };
      return {
        ...prev,
        regionsProgress: {
          ...prev.regionsProgress,
          [regionId]: { ...existing, missions }
        },
        sessionLog: [
          ...(prev.sessionLog || []),
          { ts: Date.now(), type: 'mission_attempt', payload: { regionId, missionIdx, correct, timeMs } }
        ]
      };
    });
  };

  const recordQuizAnswer = (qIdx, correct, timeMs) => {
    setState(prev => ({
      ...prev,
      sessionLog: [
        ...(prev.sessionLog || []),
        { ts: Date.now(), type: 'quiz_answer', payload: { qIdx, correct, timeMs } }
      ]
    }));
  };

  const setQuizScore = (score) => {
    setState(prev => ({
      ...prev,
      quizScore: score,
      sessionLog: [
        ...(prev.sessionLog || []),
        { ts: Date.now(), type: 'quiz_complete', payload: { score } }
      ]
    }));
  };

  const recordCategoryAnswer = (regionId, categoryId, correct) => {
    if (!correct) return;
    setState(prev => {
      const rp = prev.regionsProgress || {};
      const region = rp[regionId] || {};
      const cats = region.categories || {};
      const cat = cats[categoryId] || { correctCount: 0, attempts: 0 };
      if (cat.completed) return prev;
      const newCount = Math.min(3, (cat.correctCount || 0) + 1);
      const newCat = {
        ...cat,
        correctCount: newCount,
        attempts: (cat.attempts || 0) + 1,
        completed: newCount >= 3,
      };
      const newCats = { ...cats, [categoryId]: newCat };
      const allCatIds = (window.getCategoriesForRegion ? window.getCategoriesForRegion(regionId) : (window.CATEGORIES_BY_REGION && window.CATEGORIES_BY_REGION[regionId] || [])).map(c => c.id);
      const allDone = allCatIds.length > 0 && allCatIds.every(cid => newCats[cid] && newCats[cid].completed);
      return {
        ...prev,
        regionsProgress: {
          ...rp,
          [regionId]: {
            ...region,
            categories: newCats,
            status: allDone ? 'done' : 'partial',
            completedAt: allDone && !region.completedAt ? new Date().toISOString() : region.completedAt,
          }
        },
        sessionLog: [
          ...(prev.sessionLog || []),
          { ts: Date.now(), type: 'category_answer', payload: { regionId, categoryId, correct } }
        ]
      };
    });
  };

  const recordCategoryMissionAttempt = (regionId, categoryId, missionIdx, correct, timeMs) => {
    setState(prev => {
      const rp = prev.regionsProgress || {};
      const region = rp[regionId] || { missions: [] };
      const cats = region.categories || {};
      const cat = cats[categoryId] || { missions: [] };
      const missions = Array.isArray(cat.missions) ? [...cat.missions] : [];
      const cur = missions[missionIdx] || { attempts: 0, correct: false, timeMs: 0 };
      missions[missionIdx] = {
        attempts: (cur.attempts || 0) + 1,
        correct: !!correct || !!cur.correct,
        timeMs: (cur.timeMs || 0) + (timeMs || 0),
      };
      // 3 mission'da hepsi correct ise category completed
      const allCorrect = missions.length === 3 && missions.every(m => m && m.correct);
      const newCat = { ...cat, missions, completed: allCorrect || cat.completed };
      const newCats = { ...cats, [categoryId]: newCat };
      // Bölge done = 5 kategorinin hepsi completed
      const allCatIds = (window.getCategoriesForRegion ? window.getCategoriesForRegion(regionId) : (window.CATEGORIES_BY_REGION && window.CATEGORIES_BY_REGION[regionId] || [])).map(c => c.id);
      const allDone = allCatIds.length > 0 && allCatIds.every(cid => newCats[cid] && newCats[cid].completed);
      const newRegion = {
        ...region,
        categories: newCats,
        status: allDone ? 'done' : (region.status === 'done' ? 'done' : (Object.values(newCats).some(x => x.completed) ? 'partial' : 'open')),
        completedAt: allDone && !region.completedAt ? new Date().toISOString() : region.completedAt,
      };
      return {
        ...prev,
        regionsProgress: { ...rp, [regionId]: newRegion },
        sessionLog: [
          ...(prev.sessionLog || []),
          { ts: Date.now(), type: 'category_mission_attempt', payload: { regionId, categoryId, missionIdx, correct, timeMs } }
        ]
      };
    });
  };

  const isCategoryDone = (regionId, categoryId) => {
    const r = state.regionsProgress && state.regionsProgress[regionId];
    return !!(r && r.categories && r.categories[categoryId] && r.categories[categoryId].completed);
  };

  const getCategoryProgress = (regionId, categoryId) => {
    const r = state.regionsProgress && state.regionsProgress[regionId];
    const cat = r && r.categories && r.categories[categoryId];
    if (!cat) return { correct: 0, total: 3, completed: false };
    const correct = (typeof cat.correctCount === 'number')
      ? cat.correctCount
      : ((cat.missions || []).filter(m => m && m.correct).length);
    return { correct, total: 3, completed: !!cat.completed };
  };

  const reset = () => {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    setState({ ...INITIAL_STATE });
    // Clear cached random question selections so a fresh game gets fresh shuffles.
    if (typeof window !== 'undefined' && typeof window.resetGameOrder === 'function') {
      window.resetGameOrder();
    }
  };

  const exportJson = () => JSON.stringify(state, null, 2);

  const hasSavedGame = () => !!(state.playerName && state.playerName.length > 0);

  return {
    state,
    setPlayerName,
    setGrade,
    isRegionUnlocked,
    isRegionDone,
    getRegionStatus,
    getProgressMap,
    earnedBadgeCount,
    completeRegion,
    recordMissionAttempt,
    recordQuizAnswer,
    setQuizScore,
    reset,
    exportJson,
    hasSavedGame,
    recordCategoryMissionAttempt,
    recordCategoryAnswer,
    isCategoryDone,
    getCategoryProgress,
  };
};

Object.assign(window, { useProgress });
  </script>

  <script type="text/babel" data-presets="react">
/* Map.jsx — M2: Hazine haritası ekranı.
   Public API: window.MapScreen = ({ onRegionClick, onAllComplete }) => JSX;
   - useProgress.getProgressMap() ile bölge statüleri.
   - TurkeyMap'e onRegionClick prop'u ile bağlanır (kilitli bölgeler tıklanmaz — TurkeyMap içsel kontrol eder).
   - "Sıra X'de" başlığı: ilk açık ama tamamlanmamış bölge.
   - Sağdaki teaser metni: bölgeye özgü.
   - Rozet kuşağı progress'e göre dinamik (REGIONS sırası).
   - 7 rozet tamamlanırsa onAllComplete tetiklenir.
*/
const { useEffect: useEffectMap, useMemo: useMemoMap, useState: useStateMap } = React;

/* Bölgeye özgü teaser metinleri — REGIONS_CONTENT'te yoksa fallback. */
const MAP_TEASERS = {
  marmara:    "🌊 Boğazlar, köprüler ve sanayi şehirleri seni bekliyor",
  karadeniz:  "🌧️ Yağmurlu ormanlar ve çay tarlaları seni bekliyor",
  ege:        "🌿 Zeytinlikler ve antik kıyıların büyüsü",
  icanadolu:  "🌾 Geniş bozkırlar ve başak tarlaları seni bekliyor",
  akdeniz:    "☀️ Mavi deniz, narenciye bahçeleri ve antik kıyılar",
  doguanadolu:"⛰️ Karlı sıradağlar ve Türkiye'nin çatısı seni çağırıyor",
  guneydogu:  "🔥 Pamuk tarlaları, GAP ve sıcak güneş",
};

const teaserFor = (regionId) => {
  if (!regionId) return '';
  const rc = (window.REGIONS_CONTENT && window.REGIONS_CONTENT[regionId]) || null;
  if (rc && rc.teaser) return rc.teaser;
  return MAP_TEASERS[regionId] || '';
};

const MapScreen = ({ progressInstance, onRegionClick, onCategorySelect, onAllComplete, playerName: playerNameProp, earned: earnedProp, progress: progressMapProp, regionsProgress: regionsProgressProp, selectedRegion: selectedRegionProp }) => {
  // App'in progress instance'ı varsa onu kullan (tek doğruluk kaynağı).
  // Yoksa lokal fallback (legacy / standalone use için).
  const progress = progressInstance || window.useProgress();
  const progressMap = progressMapProp || progress.getProgressMap();
  const earned = (typeof earnedProp === 'number') ? earnedProp : progress.earnedBadgeCount();
  const playerName = playerNameProp || (progress.state && progress.state.playerName) || 'Maceracı';
  const REGIONS = window.REGIONS || [];

  // Sıra hangi bölgede? — REGIONS sırasında, status === 'open' olan ilk bölge.
  const nextRegion = useMemoMap(() => {
    return REGIONS.find(r => progressMap[r.id] === 'open') || null;
  }, [REGIONS, JSON.stringify(progressMap)]);

  // 7 rozet tamamlandığında onAllComplete tetikle.
  useEffectMap(() => {
    if (earned === 7 && typeof onAllComplete === 'function') {
      onAllComplete();
    }
  }, [earned, onAllComplete]);

  const handleRegionClick = (regionId) => {
    const status = progressMap[regionId];
    if (status === 'locked') return;
    setSelectedRegion(regionId);
    if (typeof onRegionClick === 'function') onRegionClick(regionId);
  };

  // === Settings menu handlers ===
  const handleChangeName = () => {
    const current = progress.state && progress.state.playerName || '';
    const newName = window.prompt('Yeni adın:', current);
    if (newName !== null && newName.trim()) {
      progress.setPlayerName(newName.trim());
    }
  };

  const handleExport = () => {
    const json = progress.exportJson ? progress.exportJson() : JSON.stringify(progress.state || {}, null, 2);
    const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const safeName = (progress.state && progress.state.playerName || 'oyuncu').replace(/[^\w-]/g, '_');
    a.href = url;
    a.download = `turkiye-kesfet-${safeName}-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  };

  const handleAbout = () => {
    window.alert(
      "🇹🇷 Türkiye'yi Keşfet\n" +
      "Bir Coğrafya Macerası\n\n" +
      "Ortaokul (5–7. sınıf) öğrencileri için Türkiye'nin 7 coğrafi bölgesini öğreten oyun-tabanlı öğrenme uygulaması.\n\n" +
      "📚 Pedagojik temel: Tasarım Temelli Araştırma (DBR), Gee (2003), Prensky (2001)\n" +
      "🗺️ Harita: OpenStreetMap & CartoDB\n" +
      "📊 81 il · 7 bölge · 21 mini görev · 15 quiz sorusu\n\n" +
      "Eğitim için sevgiyle geliştirildi 💛"
    );
  };

  const handleReset = () => {
    if (!window.confirm('Tüm ilerlemeyi sıfırlamak istiyor musun?\n\nKazandığın rozetler ve quiz skoru silinecek. Bu işlem geri alınamaz.')) return;
    if (progress.reset) progress.reset();
    window.location.reload();
  };

  // === Backpack modal ===
  const [backpackOpen, setBackpackOpen] = useStateMap(false);
  const [allJourneyOpen, setAllJourneyOpen] = useStateMap(false);
  // selectedRegion: App'tan gelen prop'u öncelikli kullan; lokal state sadece ilk render fallback'i
  const [localSelectedRegion, setLocalSelectedRegion] = useStateMap(selectedRegionProp || 'marmara');
  useEffectMap(() => {
    if (selectedRegionProp) setLocalSelectedRegion(selectedRegionProp);
  }, [selectedRegionProp]);
  const selectedRegion = selectedRegionProp || localSelectedRegion;
  const setSelectedRegion = setLocalSelectedRegion;
  // regionsProgress: App'tan gelen prop'u kullan (yeni kayıtlar burada)
  const regionsProgress = regionsProgressProp || (progress.state && progress.state.regionsProgress) || {};

  const headlineTitle = nextRegion
    ? `Sıra ${nextRegion.name}'de`
    : 'Tüm açık bölgeleri keşfettin!';

  const headlineTeaser = nextRegion
    ? teaserFor(nextRegion.id)
    : (earned === 7
        ? '🏆 Final sınavına hazır mısın?'
        : '✨ Yeni bölgelerin açılması için bölgeleri tamamlamaya devam et');

  return (
    <div className="paper" style={{
      height: '100vh',
      position: 'relative',
      overflow: 'hidden',
      fontFamily: 'var(--font-body)',
      color: 'var(--ink)',
      display: 'flex',
      flexDirection: 'column',
    }}>
      <window.TopBar
        name={playerName}
        earned={earned}
        total={7}
        onChangeName={handleChangeName}
        onExport={handleExport}
        onAbout={handleAbout}
        onReset={handleReset}
        onChantamClick={() => setBackpackOpen(true)}
        onJourneyClick={() => setAllJourneyOpen(true)}
        progressMap={progressMap}
      />
      {allJourneyOpen && window.AllJourneyModal && (
        <window.AllJourneyModal
          regionsProgress={regionsProgress}
          onClose={() => setAllJourneyOpen(false)}
          onCategorySelect={(rid, catId) => {
            setAllJourneyOpen(false);
            setSelectedRegion(rid);
            if (typeof onCategorySelect === 'function') onCategorySelect(rid, catId);
          }}
        />
      )}
      {backpackOpen && window.BackpackModal && (
        <window.BackpackModal progress={progress} onClose={() => setBackpackOpen(false)}/>
      )}

      {/* Header (flex-shrink) */}
      <div data-tk="map-header" style={{ padding: '10px 56px 0', flexShrink: 0 }}>
        <div style={{
          display: 'flex',
          alignItems: 'baseline',
          justifyContent: 'space-between',
          gap: 24,
          flexWrap: 'wrap',
        }}>
          <div>
            <div className="t-label" style={{ fontSize: 12 }}>Hazine Haritası</div>
            <div style={{
              fontFamily: 'var(--font-display)',
              fontSize: 36,
              color: 'var(--title)',
              lineHeight: 1,
            }} data-tk="map-headline">
              {headlineTitle}
            </div>
          </div>
          <div style={{
            fontFamily: 'var(--font-hand)',
            fontSize: 18,
            color: 'var(--ink-soft)',
            maxWidth: 480,
            textAlign: 'right',
          }} data-tk="map-teaser">
            {headlineTeaser}
          </div>
        </div>
      </div>

      {/* Map (flex 1 — fills remaining vertical space) */}
      <div data-tk="map-wrapper" style={{
        padding: '8px 56px 6px',
        flex: 1,
        minHeight: 0,
        display: 'flex',
      }}>
        <div data-tk="map-card" style={{
          flex: 1,
          minHeight: 0,
          padding: 8,
          borderRadius: 16,
          background: 'var(--bg-cream)',
          border: '1.5px solid var(--rule)',
          boxShadow: 'var(--shadow-md)',
          display: 'flex',
        }}>
          <window.TurkeyMap
            progress={progressMap}
            onRegionClick={handleRegionClick}
            height="100%"
          />
        </div>
      </div>

      {/* Yolculuk Haritam — kategori bazlı ilerleme (haritanın altında) */}
      {window.JourneyMap && (
        <window.JourneyMap
          regionId={selectedRegion}
          regionsProgress={regionsProgress}
          onCategorySelect={(rid, catId) => {
            setSelectedRegion(rid);
            if (typeof onCategorySelect === 'function') onCategorySelect(rid, catId);
          }}
        />
      )}
    </div>
  );
};

Object.assign(window, { MapScreen });
  </script>
